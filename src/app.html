  renderNav();
  if(S.view==='shop')renderShop();
  else if(S.view==='mine')renderMine();
  else if(S.view==='profile')renderProfile();
  else renderSeller();
}
function go(v){
  S.view=v;S.cc=null;
  render();window.scrollTo(0,0);
  if(v==='mine')loadMine();
  if(v==='shop')loadCfg();
  if(v==='seller')loadAdmin();
}
/* поле количества потеряло фокус: пустое или 0 убирает товар, слишком большое число обрезается */
function qtyDone(t){
  const id=t.dataset.qty,cur=S.cart[id]||0;
  let v=Math.floor(Number(t.value));
  if(!isFinite(v)||v<1)v=0;
  v=cartSet(id,v);   // обрезает до остатка и сохраняет
  if(!v){
    if(!cartCount()){S.shopStep='list';renderShop();renderNav();return}
    if(S.shopStep==='cart'){paintCartLines();paintShopBar();renderNav()}else paintShopCtl(id);
    return;
  }
  t.value=String(v);
  if(cur!==v)refreshTotals(id);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const a=t.dataset.act;
  if(a==='lang')switchLang();
  else if(a==='nav'){
    if(t.dataset.v==='shop'&&S.view!=='shop'){S.shopPlaced=null;S.shopStep='list'}
    go(t.dataset.v);
  }
  else if(a==='submitorder')submitOrder();
  else if(a==='mode'){
    S.form.mode=t.dataset.v==='delivery'?'delivery':'pickup';saveForm();
    renderCart();
  }
  else if(a==='scat'){S.shopCat=t.dataset.id;renderShop()}
  else if(a==='fav')toggleFav(t.dataset.id);
  else if(a==='pdesc')t.classList.toggle('open');
  else if(a==='padd'||a==='pplus'||a==='pminus'){
    const id=t.dataset.id,cur=S.cart[id]||0;
    if(a==='padd'&&!cur&&cartLines().length>=MAX_LINES){toast(L('В корзине не больше '+MAX_LINES+' разных товаров','Savatda '+MAX_LINES+' tadan ortiq turli mahsulot boʻlmaydi'));return}
    cartSet(id,a==='pminus'?cur-1:cur+1);
    paintShopCtl(id);
  }
  else if(a==='ppack'||a==='cpack'){
    const id=t.dataset.id,p=S.prod.items.find(x=>x.id===id),size=p?packSize(p,t.dataset.k):0,cur=S.cart[id]||0;
    if(!p||!size)return;
    if(!cur&&cartLines().length>=MAX_LINES){toast(L('В корзине не больше '+MAX_LINES+' разных товаров','Savatda '+MAX_LINES+' tadan ortiq turli mahsulot boʻlmaydi'));return}
    cartSet(id,cur+size);
    if(a==='ppack')paintShopCtl(id);
    else{paintCartLines();paintShopBar();renderNav()}
  }
  else if(a==='cplus'||a==='cminus'){
    const id=t.dataset.id,cur=S.cart[id]||0;
    cartSet(id,a==='cminus'?cur-1:cur+1);
    if(!cartCount()){S.shopStep='list';renderShop();renderNav();return}
    paintCartLines();
    paintShopBar();renderNav();
  }
  else if(a==='opencart'){S.shopStep='cart';renderShop();window.scrollTo(0,0)}
  else if(a==='shoplist'){S.shopStep='list';renderShop();window.scrollTo(0,0)}
  else if(a==='shopagain'){S.shopPlaced=null;S.shopStep='list';renderShop();window.scrollTo(0,0)}
  else if(a==='cadd'){
    if(S.prod.cats.length>=MAX_CATS){toast(L('Больше '+MAX_CATS+' категорий нельзя',MAX_CATS+' tadan ortiq kategoriya boʻlmaydi'));return}
    const c={id:'c'+Math.random().toString(36).slice(2,8),name:L('Новая категория','Yangi kategoriya'),uz:'Yangi kategoriya'};
    S.prod.cats.push(c);queueSave('prod');paintSeller();
    const inp=document.querySelector('[data-cid="'+c.id+'"][data-cp="name"]');if(inp){inp.focus();inp.select()}
  }
  else if(a==='cdel'){
    const id=t.dataset.id;
    if(S.prod.items.some(p=>p.cat===id)){toast(L('В категории есть товары. Сначала перенесите или удалите их.','Kategoriyada mahsulotlar bor. Avval ularni koʻchiring yoki oʻchiring.'));return}
    S.prod.cats=S.prod.cats.filter(c=>c.id!==id);queueSave('prod');paintSeller();
  }
  else if(a==='pfilter'){S.pfilter=t.dataset.id;paintSeller()}
  else if(a==='pnew'){
    if(!S.prod.cats.length){toast(L('Сначала создайте категорию','Avval kategoriya yarating'));return}
    if(S.prod.items.length>=MAX_ITEMS){toast(L('Больше '+MAX_ITEMS+' товаров нельзя',MAX_ITEMS+' tadan ortiq mahsulot boʻlmaydi'));return}
    const cat=S.pfilter!=='all'?S.pfilter:S.prod.cats[0].id;
    const p={id:'p'+Math.random().toString(36).slice(2,9),cat,name:L('Новый товар','Yangi mahsulot'),uz:'Yangi mahsulot',desc:'',descUz:'',amount:0,unit:'g',price:0,on:true,tag:'',old:0,pv:'',tiers:[],blk:0,box:0};
    S.prod.items.push(p);queueSave('prod');paintSeller();
    const inp=document.getElementById('pname-'+p.id);
    if(inp){inp.focus();inp.select();try{inp.scrollIntoView({block:'center'})}catch(x){}}
  }
  else if(a==='pdel'){
    const id=t.dataset.id;
    if(S.cd===id){
      S.cd=null;
      S.prod.items=S.prod.items.filter(p=>p.id!==id);delete S.cart[id];delete S.stk[id];saveCart();
      queueSave('prod');paintSeller();
    }else{
      S.cd=id;t.textContent=L('Точно удалить?','Aniq oʻchirilsinmi?');
      setTimeout(()=>{if(S.cd===id){S.cd=null;t.textContent=L('Удалить товар','Mahsulotni oʻchirish')}},4000);
    }
  }
  else if(a==='pmove'){
    const id=t.dataset.id,d=Number(t.dataset.d)||0,arr=S.prod.items;
    const vis=arr.map((p,i)=>i).filter(i=>S.pfilter==='all'||arr[i].cat===S.pfilter);
    const pos=vis.indexOf(arr.findIndex(p=>p.id===id)),to=pos+d;
    if(pos<0||to<0||to>=vis.length)return;
    const a1=vis[pos],b1=vis[to],tmp=arr[a1];arr[a1]=arr[b1];arr[b1]=tmp;
    queueSave('prod');paintSeller();
    const row=document.getElementById('prow-'+id);if(row)try{row.scrollIntoView({block:'center'})}catch(x){}
  }
  else if(a==='phdel')removePhoto(t.dataset.id);
  else if(a==='copy'){
    const v=t.dataset.v||'';
    const lab=L('Номер: ','Raqam: ')+v;
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast(L('Номер скопирован','Raqam nusxalandi')),()=>toast(lab));
    else toast(lab);
  }
  else if(a==='stab'){
    S.sellerTab=t.dataset.t;S.sc=null;
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.t===S.sellerTab)));
    try{t.scrollIntoView({block:'nearest',inline:'nearest'})}catch(x){}
    paintSeller();
    if(S.sellerTab==='stock'){loadStock();if(S.jrOpen)loadJournal()}
    if(S.sellerTab==='clients')loadClients();
    if(S.sellerTab==='reports')loadReport();
  }
  else if(a==='rdays'){const v=Number(t.dataset.v);if(RP_DAYS.includes(v)&&v!==S.rep.days){S.rep.days=v;S.rep.sel=-1;S.rep.hov=-1;S.rep.allP=false;loadReport()}}
  else if(a==='rsel'){if(Date.now()-S.rep.skip<400)return;const i=Number(t.dataset.i);S.rep.sel=S.rep.sel===i?-1:i;S.rep.hov=-1;repShow(S.rep.sel)}
  else if(a==='rtab'){S.rep.tab=!S.rep.tab;paintRep()}
  else if(a==='rall'){S.rep.allP=!S.rep.allP;paintRep()}
  else if(a==='rretry')loadReport();
  else if(a==='sfilter'){S.sfilter=t.dataset.v;paintStock()}
  else if(a==='sjr'){S.jrOpen=!S.jrOpen;paintStock();if(S.jrOpen)loadJournal()}
  else if(a==='sin'||a==='sset'){
    const id=t.dataset.id,n=stockNum(id,'sn',a==='sin'?1:0);
    if(n===null)return;
    const body={op:a==='sin'?'in':'set',n},u=stockUnit(id),pr=S.prod.items.find(x=>x.id===id);
    if(u)body.u=u;
    const pcs=u&&pr?n*packSize(pr,u):0,ex=pcs?' ('+(a==='sin'?'+':'= ')+pcs+' '+pcsWord()+')':'';
    stockDo(id,body,(a==='sin'?L('Приход записан','Kirim yozildi'):L('Остаток исправлен','Qoldiq tuzatildi'))+ex);
  }
  else if(a==='sstart'){
    const id=t.dataset.id,n=stockNum(id,'sn',0);
    if(n===null)return;
    const body={op:'set',n},u=stockUnit(id);
    if(u)body.u=u;
    const lw=document.getElementById('sl-'+id),raw=lw?String(lw.value).trim():'';
    if(raw!==''){
      const v=Number(raw);
      if(!Number.isInteger(v)||v<0||v>1000000){toast(L('Порог — целое число, 0 или больше','Chegara — butun son (0 yoki koʻp)'));lw.focus();return}
      body.low=v;
    }
    stockDo(id,body,L('Учёт начат','Hisob boshlandi'));
  }
  else if(a==='soff'){
    const id=t.dataset.id;
    if(S.sc===id){S.sc=null;stockDo(id,{op:'off'},L('Учёт отключён','Hisob oʻchirildi'))}
    else{
      S.sc=id;paintStockRow(id);
      setTimeout(()=>{if(S.sc===id){S.sc=null;paintStockRow(id)}},4000);
    }
  }
  else if(a==='cfilter'){S.cg=t.dataset.v;paintClientList()}
  else if(a==='copen')toggleClient(Number(t.dataset.id));
  else if(a==='csave')saveClient(Number(t.dataset.id));
  else if(a==='cgrp'){const el=document.getElementById('ce-grp');if(el){el.value=t.dataset.v;el.focus()}}
  else if(a==='cldel'){
    const uid=Number(t.dataset.id);
    if(S.cDel===uid){S.cDel=null;deleteClient(uid)}
    else{
      S.cDel=uid;t.textContent=L('Точно удалить из базы?','Bazadan aniq oʻchirilsinmi?');
      setTimeout(()=>{if(S.cDel===uid){S.cDel=null;t.textContent=L('Удалить из базы','Bazadan oʻchirish')}},4000);
    }
  }
  else if(a==='pmenu'){S.pm=!S.pm;paintSeller()}
  else if(a==='impapply')impApply();
  else if(a==='impcancel'){S.imp=null;paintSeller()}
  else if(a==='pick')openPick(t.dataset.day?{day:t.dataset.day}:{});
  else if(a==='pick1')openPick({ids:[t.dataset.id]});
  else if(a==='pclose')closePick();
  else if(a==='pprint')printPick();
  else if(a==='xport')doExport(t.dataset.k,t.dataset.k==='report'?{days:S.rep.days}:undefined);
  else if(a==='xpick'){if(S.pick)doExport('pick',S.pick.body)}
  else if(a==='pfsave')saveProfile();
  else if(a==='repeat')repeatOrder(t.dataset.id);
  else if(a==='addr'){
    const x=S.profile&&S.profile.addrs[Number(t.dataset.i)];
    if(!x)return;
    S.form.address=x;saveForm();
    const ta=$('#f-address');
    if(ta){ta.value=x;ta.setAttribute('aria-invalid','false')}
    const er=$('#e-address');if(er)er.textContent='';
    markAddr();
  }
  else if(a==='filter'){S.filter=t.dataset.v;paintSeller()}
  else if(a==='status'){setStatus(t.dataset.id,t.dataset.to)}
  else if(a==='contact'){try{if(S.tg&&S.initData&&S.tg.openTelegramLink){e.preventDefault();S.tg.openTelegramLink(t.href)}}catch(err){}}
  else if(a==='scancel'||a==='mycancel'){
    const id=t.dataset.id;
    if(S.cc===id){
      S.cc=null;
      if(a==='scancel')setStatus(id,'cancelled');
      else cancelMine(id);
    }else{
      S.cc=id;
      if(S.view==='seller')paintSeller();else renderMine();
      setTimeout(()=>{if(S.cc===id){S.cc=null;if(S.view==='seller')paintSeller();else if(S.view==='mine')renderMine()}},4000);
    }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;paintGrid()}
  else if(t.id==='cq'){S.cq=t.value;paintClientList()}
  else if(t.dataset.qty!==undefined){
    /* количество вводят с клавиатуры: пока клиент печатает, обновляем только суммы */
    const id=t.dataset.qty;let v=Math.floor(Number(t.value));
    if(!isFinite(v)||v<1)return;
    const w=cartSet(id,v);
    if(w!==v)t.value=String(w);
    if(!w){qtyDone(t);return}
    refreshTotals(id);
  }
  else if(t.dataset.f){
    const f=t.dataset.f;S.form[f]=t.value;
    if(f==='date')fillTimes();
    if(f==='name'||f==='phone'||f==='address')saveForm();
    if(f==='address')markAddr();
    const er=$('#e-'+f);if(er&&er.textContent){er.textContent='';t.setAttribute('aria-invalid','false')}
  }
  else if(t.dataset.pid!==undefined){
    const p=S.prod.items.find(x=>x.id===t.dataset.pid),k=t.dataset.pp;
    if(!p)return;
    if(k==='on'){p.on=t.checked;const row=t.closest('.prow');if(row)row.classList.toggle('off',!t.checked)}
    else if(k==='amount'||k==='price'||k==='old'){const v=Number(t.value);p[k]=isFinite(v)&&v>=0?v:0;if(k==='price')syncTiers(p)}
    else if(k==='blk'||k==='box'){const v=Math.round(Number(t.value));p[k]=v>=2&&v<=500?v:0}
    else if(k==='tn'||k==='tp')syncTiers(p);
    else p[k]=t.value;
    queueSave('prod');
  }
  else if(t.dataset.cid!==undefined){
    const c=S.prod.cats.find(x=>x.id===t.dataset.cid);
    if(!c)return;
    c[t.dataset.cp]=t.value;
    queueSave('prod');
  }
  else if(t.dataset.sd!==undefined)syncDisc();
  else if(t.dataset.s){
    const k=t.dataset.s;
    if(k==='delivery')S.cfg.shop.delivery=t.checked;
    else if(['leadHours','deliveryLeadHours','openFrom','openTo','minOrder','deliveryFee','freeDeliveryFrom'].includes(k)){const v=Number(t.value);S.cfg.shop[k]=isFinite(v)&&v>=0?v:0}
    else S.cfg.shop[k]=t.value;
    if(k==='name'){$('#brandName').textContent=t.value||DEFAULT.shop.name;document.title=t.value||DEFAULT.shop.name}
    queueSave();
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t&&t.type==='file'&&t.dataset.imp){
    const f=t.files&&t.files[0];
    if(f)importFile(f);
    try{t.value=''}catch(x){}
  }
  else if(t&&t.type==='file'&&t.dataset.photo){
    const f=t.files&&t.files[0];
    if(f)uploadPhoto(t.dataset.photo,f);
    try{t.value=''}catch(x){}
  }
  else if(t&&t.dataset&&t.dataset.qty!==undefined)qtyDone(t);
  else if(t&&t.dataset&&t.dataset.sl!==undefined){
    /* порог «мало» у товара, по которому уже ведётся учёт, сохраняется сразу */
    const id=t.dataset.sl,s=S.stk[id];
    if(!s)return;
    const raw=String(t.value).trim(),v=Number(raw);
    if(raw===''||!Number.isInteger(v)||v<0||v>1000000){toast(L('Порог — целое число, 0 или больше','Chegara — butun son (0 yoki koʻp)'));t.value=String(s.low);return}
    if(v!==s.low)stockDo(id,{op:'low',n:v},L('Порог сохранён','Chegara saqlandi'),true);
  }
});
/* картинка не загрузилась: оставляем заглушку */
document.addEventListener('error',e=>{
  const t=e.target;
  if(t&&t.tagName==='IMG'&&t.closest('.pimg,.cth,.pthumb,.th')){
    const ph=document.createElement('span');ph.className='ph';ph.textContent='📦';ph.setAttribute('aria-hidden','true');
    t.replaceWith(ph);
  }
},true);

/* ---------- network ---------- */
async function api(method,path,body){
  try{
    const h={'content-type':'application/json'};
    if(S.initData)h['x-init-data']=S.initData;
    const r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
    let data=null;try{data=await r.json()}catch(e){}
    return {ok:r.ok,status:r.status,data};
  }catch(e){return {ok:false,status:0,data:null}}
}
async function loadMine(){
  if(!S.auth)return;
  const r=await api('GET','/api/my-orders');
  if(!r.ok||!r.data)return;
  if(JSON.stringify(r.data.orders)===JSON.stringify(S.myOrders))return;
  S.myOrders=r.data.orders;renderNav();
  if(S.view==='mine')renderMine();
}
async function loadAdmin(){
  if(!S.admin)return;
  loadStock();
  if(S.sellerTab==='clients')loadClients();
  const r=await api('GET','/api/admin/orders');
  if(!r.ok||!r.data)return;
  if(JSON.stringify(r.data.orders)===JSON.stringify(S.allOrders)&&JSON.stringify(r.data.stats)===JSON.stringify(S.stats))return;
  S.allOrders=r.data.orders;S.stats=r.data.stats;renderNav();
  if(S.view==='seller'&&S.sellerTab==='orders')paintSeller();
}
async function loadCfg(){
  if(S.dirty||S.saving||!S.ready)return;
  const r=await api('GET','/api/config');
  if(!r.ok||!r.data)return;
  const next=mergeCfg(r.data.cfg),nextP=normProd(r.data.prod);
  if(JSON.stringify(next)===JSON.stringify(S.cfg)&&JSON.stringify(nextP)===JSON.stringify(S.prod))return;
  const ae=document.activeElement;
  if(S.view==='shop'&&ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  S.cfg=next;S.prod=nextP;normalizeMode();
  const pruned=pruneCart();
  renderNav();
  if(S.view==='shop'&&!S.shopPlaced){
    if(S.shopStep==='cart'&&!cartCount())S.shopStep='list';
    renderShop();
    if(pruned)toast(L('Остатки изменились, мы обновили корзину','Qoldiq oʻzgardi, savatni yangiladik'));
  }
}
function applyTheme(){
  try{
    const cs=S.tg&&S.tg.colorScheme;
    if(cs==='dark'||cs==='light')document.documentElement.setAttribute('data-theme',cs);
    const dark=cs?cs==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
    const bg=dark?'#0E1614':'#F3F7F6';
    if(S.tg&&S.tg.setHeaderColor){S.tg.setHeaderColor(bg);S.tg.setBackgroundColor(bg)}
  }catch(e){}
}
let tickN=0;
function tick(){
  if(document.visibilityState==='hidden'||!S.ready)return;
  tickN++;
  if(S.auth&&S.view==='mine')loadMine();
  if(S.admin&&(S.view==='seller'||tickN%2===0))loadAdmin();
  if(tickN%4===0)loadCfg();
}
(async function init(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){
    S.tg=tg;
    if(tg.initData)S.initData=tg.initData;
    try{tg.ready();tg.expand();if(tg.onEvent)tg.onEvent('themeChanged',applyTheme)}catch(e){}
  }
  initLang();applyTheme();
  renderNav();
  view.innerHTML='<div class="wrap page"><div class="empty"><b>'+L('Загружаем каталог','Katalog yuklanmoqda')+'</b>'+L('Подождите секунду.','Bir soniya kuting.')+'</div></div>';
  if(S.initData){
    const r=await api('GET','/api/bootstrap');
    if(r.ok&&r.data){
      S.auth=true;S.uid=r.data.me.id;S.admin=!!r.data.me.admin;
      S.cfg=mergeCfg(r.data.cfg);S.prod=normProd(r.data.prod);S.myOrders=r.data.orders||[];
      S.profile=r.data.me.profile||null;S.blocked=!!r.data.me.blocked;S.fav=Array.isArray(r.data.me.fav)?r.data.me.fav:[];
    }else S.authErr=(r.data&&r.data.error)||'net';
  }
  if(!S.auth){
    const r=await api('GET','/api/config');
    if(r.ok&&r.data){S.cfg=mergeCfg(r.data.cfg);S.prod=normProd(r.data.prod)}
  }
  loadCart();pruneCart();loadForm();applyProfile();normalizeMode();
  S.ready=true;
  render();
  if(S.admin)loadAdmin();
  setInterval(tick,15000);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible')return;
    loadCfg();loadMine();loadAdmin();
  });
})();
</script>
</body></html>
