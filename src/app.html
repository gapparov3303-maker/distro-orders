<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: catalog with search and categories, cart with order form; seller panel is a tabbed list of orders, catalog editor and settings. */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#E7EFED; --ink:#14231F; --ink-2:#5B6E69; --line:#D6E3E0;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#D9F0EC;
  --stage-a:#E2F1EE; --stage-b:#E6ECF7;
  --ok:#1F7A4D; --ok-soft:#DDF3E6; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#FBE0DD; --info:#1F5FA3; --info-soft:#DCEBFA; --mute:#5B6E69; --mute-soft:#E7EFED;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hdr:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#162220; --surface-2:#1D2D2A; --ink:#E8F3F0; --ink-2:#9DB5AF; --line:#27403B;
    --accent:#4FD1C0; --accent-ink:#06211D; --accent-soft:#16403A;
    --stage-a:#1B2B28; --stage-b:#1B2433;
    --ok:#6FD3A0; --ok-soft:#1D3A2D; --warn:#F2B957; --warn-soft:#3F3015; --bad:#FF8A80; --bad-soft:#44201E; --info:#7DB6F0; --info-soft:#1B3149; --mute:#9DB5AF; --mute-soft:#1D2D2A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#162220; --surface-2:#1D2D2A; --ink:#E8F3F0; --ink-2:#9DB5AF; --line:#27403B;
  --accent:#4FD1C0; --accent-ink:#06211D; --accent-soft:#16403A;
  --stage-a:#1B2B28; --stage-b:#1B2433;
  --ok:#6FD3A0; --ok-soft:#1D3A2D; --warn:#F2B957; --warn-soft:#3F3015; --bad:#FF8A80; --bad-soft:#44201E; --info:#7DB6F0; --info-soft:#1B3149; --mute:#9DB5AF; --mute-soft:#1D2D2A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-text-size-adjust:100%;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px/1 var(--f-display);letter-spacing:.01em;min-width:0}
.brand svg{flex:none}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{display:flex;align-items:center;gap:8px;flex:none}
.nav{display:flex;flex:none;gap:2px;background:var(--surface-2);padding:4px;border-radius:12px}
.nav button{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,35,31,.14)}
.langbtn{appearance:none;height:38px;min-width:42px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;letter-spacing:.04em;cursor:pointer}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
@media (max-width:430px){.nav button{padding:7px 7px;font-size:12.5px;gap:4px}.nav{gap:1px;padding:3px}.langbtn{min-width:38px;padding:0 6px}.right{gap:6px}}
@media (max-width:480px){.brand span{display:none}}
@media (max-width:390px){.brand{display:none}.top .wrap{justify-content:space-between}}

/* sections, chips */
.sec{padding-top:18px}
.sec h2{font:700 13px/1.2 var(--f-display);letter-spacing:.02em;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),inset 0 0 0 1px var(--accent)}

/* forms */
.lab{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad)}
textarea{resize:vertical;min-height:72px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:540px){.form{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--bad);font-size:12px;margin-top:4px;min-height:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,35,31,.14)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.sum .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.sum .r span:first-child{min-width:0;overflow-wrap:anywhere}
.sum .r span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sum .r.t{border-bottom:0;font-weight:700;padding-top:10px}
.sum .r.t span:last-child{font:700 16px var(--f-display)}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.note.warnnote{background:var(--warn-soft);color:var(--warn);font-weight:600}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:wait}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar small{display:block;font-size:12px;color:var(--ink-2)}
.bar strong{font:700 17px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center}

/* orders */
.page{padding-block:18px 56px}
.page h1{font:700 18px/1.25 var(--f-display);margin-bottom:6px;text-wrap:balance}
.lead{color:var(--ink-2);margin-bottom:16px;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:12px;color:var(--ink-2)}
.stat b{font:700 16px/1.3 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.hot{background:var(--accent-soft);border-color:var(--accent)}
.tabs{display:flex;flex-wrap:nowrap;gap:0;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:transparent;border:0;border-bottom:2.5px solid transparent;box-shadow:inset 0 -1px 0 var(--line);padding:10px 12px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
.tab .badge{margin-left:3px}
/* шесть вкладок на узком экране: две строки по три, чтобы ни одна не пряталась за краем */
@media (max-width:520px){.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}.tab{padding:10px 4px;font-size:13px;text-align:center;white-space:normal}.tab .badge{margin-left:2px;min-width:16px;height:16px;padding:0 4px;font-size:10px}}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ordlist{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.ordlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ord{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.ord.is-new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ord .th{background:linear-gradient(160deg,var(--stage-a),var(--stage-b));border-radius:12px;align-self:start;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ord .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px}
.ord .th .ph{font-size:34px}
.ord .ob{min-width:0;display:grid;gap:5px;align-content:start}
.oh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oid{font:700 13px var(--f-display);letter-spacing:.02em}
.when{font-weight:600}
.spec{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.cust{font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cm{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere}
.tot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tot b{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.xtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.xmenu{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.xmenu .chip[disabled]{opacity:.45;cursor:default}
.xtools .unit{width:100%;font-size:12px;color:var(--ink-2)}
.pov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pov[hidden]{display:none}
.pbar{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.pbar .grow{flex:1}
.pframe{flex:1;width:100%;border:0;background:#fff;color-scheme:light}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.info{background:var(--info-soft);color:var(--info)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.mute{background:var(--mute-soft);color:var(--mute)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);font:700 15px var(--f-display);margin-bottom:6px}
.ord .pl{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.ord .pl span:first-child{min-width:0;overflow-wrap:anywhere}
.ord .pl span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* settings, cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card h3{font:700 13px var(--f-display);margin-bottom:2px}
.card .unit{font-size:12px;color:var(--ink-2);margin-bottom:6px}
.savebar{font-size:12px;color:var(--ink-2);min-height:18px;margin-bottom:10px}
.savebar.bad{color:var(--bad)}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:540px){.settings{grid-template-columns:minmax(0,1fr)}}
.settings .full{grid-column:1/-1}

/* catalog (client) */
.shop{padding-block:14px 130px}
.shop h1{font:700 18px/1.25 var(--f-display);margin-bottom:12px}
.shop .search{margin-bottom:10px}
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 10px;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pchips .chip{flex:none;white-space:nowrap}
.chead{font:700 14px var(--f-display);margin:20px 0 10px}
.chg{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.chg b{display:block;font-size:14px}.chg small{display:block;color:var(--ink-2)}
.chg.bad small{color:var(--bad)}
.impsum{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:13px}
.impsum b{font-size:15px}
.chead:first-child{margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard.off .pimg img,.pcard.off .pimg .ph{opacity:.45;filter:grayscale(1)}
.pcard.off .pname,.pcard.off .pprice{color:var(--ink-2)}
.pimg{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,var(--stage-a),var(--stage-b));display:flex;align-items:center;justify-content:center;overflow:hidden}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:34px;line-height:1}
.pimg .lbl{position:absolute;left:8px;top:8px;z-index:1;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--info);color:var(--surface)}
.pimg .lbl.sale{background:var(--bad)}
.pimg .fav{position:absolute;right:6px;top:6px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink-2);cursor:pointer;box-shadow:0 1px 3px rgba(20,35,31,.25)}
.pimg .fav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.pimg .fav[aria-pressed="true"]{color:var(--bad)}
.pimg .fav[aria-pressed="true"] svg{fill:currentColor}
.pold{display:inline-block;margin-right:6px;font:500 12px var(--f-body);color:var(--ink-2);text-decoration:line-through}
.psale{margin-left:6px;font:700 11px var(--f-body);color:var(--bad)}
.ptier{display:block;font:500 11.5px/1.35 var(--f-body);color:var(--ink-2);margin-top:1px}
.ptier.on{color:var(--accent);font-weight:700}
.ppack{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ppack .chip{flex:1 1 auto;height:auto;min-height:34px;padding:5px 8px;font-size:12px;white-space:nowrap}
.cline>.ppack{grid-column:1/-1;margin-top:0}
.cline .cn small.tiernext{color:var(--accent);font-weight:600}
.cline .cn small.packtxt{color:var(--ink-2)}
.sum .r.disc span:last-child{color:var(--ok);font-weight:600}
.tiers{display:grid;gap:6px}
.trow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.trow input{width:0;flex:1 1 70px;min-width:0;padding:8px 8px}
.trow span{flex:none}
.sact select{flex:0 1 auto;max-width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.snum small.pk{margin-top:2px;font-size:11px;color:var(--ink-2)}
/* отчёты */
.rkpi small.dl{margin-top:2px;font-size:11.5px;font-weight:600}
.rkpi small.dl.up{color:var(--ok)}
.rkpi small.dl.down{color:var(--bad)}
.rkpi small.dl.flat{color:var(--ink-2)}
.rnote{font-size:12px;color:var(--ink-2);margin:6px 0 0}
.rread{min-height:20px;font-size:13px;margin:6px 0 8px;color:var(--ink)}
.rread b{font-variant-numeric:tabular-nums}
.rchart{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;padding-top:8px}
.ryax{position:relative;height:150px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ryax span{position:absolute;right:0;transform:translateY(50%);white-space:nowrap}
.rplot{position:relative;height:150px;isolation:isolate}
.rgrid{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.rcols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px;touch-action:pan-y}
.rcol{appearance:none;border:0;background:transparent;padding:0;margin:0;flex:1 1 0;min-width:0;max-width:30px;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative}
.rcol i{display:block;width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.rcol[aria-pressed="true"]::after{content:"";position:absolute;inset:0;background:var(--accent-soft);z-index:-1;border-radius:4px}
.rcol:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rxax{display:flex;justify-content:space-between;margin:4px 0 0 50px;font-size:11px;color:var(--ink-2)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.rrow .rl{min-width:0}
.rrow .rl b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rrow .rl small{display:block;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.rrow .rv{font:700 13px var(--f-display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rbar{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rbuy{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.rlist>div:first-child{border-top:0}
.rlist+.btn{margin-top:8px}
.rgap{margin-top:10px}
.rbuy .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rbuy .rh b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rbuy small{font-size:12.5px;color:var(--ink-2)}
.rtab table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rtab th,.rtab td{text-align:right;padding:5px 4px;border-top:1px solid var(--line)}
.rtab th:first-child,.rtab td:first-child{text-align:left}
.rtab th{font-weight:600;color:var(--ink-2);font-size:12px}
.pimg .tag{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;z-index:1}

<script>
/*SHARED*/

/* ---------- app ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const MAX_QTY=500,MAX_LINES=30,MAX_CATS=40,MAX_ITEMS=300;
const S={
  view:'shop',sellerTab:'orders',filter:'active',
  cfg:clone(DEFAULT),
  form:{name:'',phone:'',mode:'pickup',address:'',date:'',time:'',comment:''},
  myOrders:[],allOrders:[],stats:{doneSum:0,doneCount:0},
  tg:null,initData:'',uid:null,admin:false,auth:false,ready:false,authErr:'',
  busy:false,dirty:false,saving:false,again:false,saveState:'',cc:null,
  prod:{cats:[],items:[]},cart:{},shopCat:'all',shopStep:'list',shopPlaced:null,q:'',
  pfilter:'all',upl:{},dirtyC:false,dirtyP:false,cd:null,
  stk:{},stkLoaded:false,sfilter:'all',sbusy:{},sc:null,jr:[],jrOpen:false,
  profile:null,blocked:false,pfBusy:false,
  cl:[],clLoaded:false,cq:'',cg:'all',cOpen:null,cDet:{},cBusy:false,cDel:null,
  pm:false,xbusy:'',pick:null,pickBusy:false,
  fav:[],favT:null,favSeq:0,imp:null,impBusy:false,
  rep:{days:30,data:null,busy:false,err:false,sel:-1,hov:-1,allP:false,tab:false,seq:0,drag:false,skip:0}
};
const view=$('#view');
let toastT=null,saveT=null;

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},Math.min(8000,Math.max(3200,String(msg).length*55)));
}
const waitMs=ms=>new Promise(r=>setTimeout(r,ms));
/* способ получения: доставка доступна, только если продавец её включил */
const mode=()=>S.cfg.shop.delivery!==false&&S.form.mode==='delivery'?'delivery':'pickup';
const pickup=()=>pickupInfo(S.cfg,shopNow(),leadFor(S.cfg,mode()));
function normalizeMode(){if(S.cfg.shop.delivery===false)S.form.mode='pickup'}

/* ---------- каталог: данные и корзина ---------- */
const normProd=d=>{const o={cats:[],items:[]};if(d&&typeof d==='object'){if(Array.isArray(d.cats))o.cats=d.cats.filter(x=>x&&typeof x==='object');if(Array.isArray(d.items))o.items=d.items.filter(x=>x&&typeof x==='object')}return o};
const imgUrl=p=>'/img/'+encodeURIComponent(p.id)+'?v='+encodeURIComponent(p.pv||'');
const pimg=p=>p.pv?'<img src="'+imgUrl(p)+'" alt="'+esc(nm(p))+'" loading="lazy" decoding="async">':'<span class="ph" aria-hidden="true">📦</span>';
function loadCart(){try{const c=JSON.parse(localStorage.getItem('sh-cart')||'{}');if(c&&typeof c==='object'&&!Array.isArray(c))S.cart=c}catch(e){}}
function saveCart(){try{localStorage.setItem('sh-cart',JSON.stringify(S.cart))}catch(e){}}
/* имя, телефон, способ и адрес запоминаем на телефоне, чтобы повторный заказ был быстрее */
function loadForm(){
  try{
    const f=JSON.parse(localStorage.getItem('sh-form')||'{}');
    if(f&&typeof f==='object'){
      ['name','phone','address'].forEach(k=>{if(typeof f[k]==='string')S.form[k]=f[k].slice(0,200)});
      if(f.mode==='delivery')S.form.mode='delivery';
    }
  }catch(e){}
}
function saveForm(){try{localStorage.setItem('sh-form',JSON.stringify({name:S.form.name,phone:S.form.phone,address:S.form.address,mode:S.form.mode}))}catch(e){}}
/* профиль на сервере главнее того, что запомнил телефон: имя и телефон берём из него; адрес подставляем, если поле пустое */
function applyProfile(){
  const p=S.profile;if(!p)return;
  if(p.name)S.form.name=p.name;
  if(p.phone)S.form.phone=p.phone;
  if(!S.form.address&&p.addrs&&p.addrs.length)S.form.address=p.addrs[0];
  saveForm();
}
const blockedTxt=()=>L('Оформление заказов для вас сейчас недоступно. Свяжитесь с продавцом','Hozir siz uchun buyurtma berish mavjud emas. Sotuvchi bilan bogʻlaning')+(S.cfg.shop.phone?': '+S.cfg.shop.phone:'.');
/* Товар нельзя заказать: продавец снял галочку «В наличии» или свободный остаток равен нулю. Поле av приходит с сервера у товаров с учётом (сколько можно заказать, не больше 500), lw — товара мало. */
const soldOut=p=>p.on===false||p.av===0;
/* Сколько штук можно положить в корзину: до 500, а у товаров с учётом — не больше свободного остатка. */
const maxQty=p=>typeof p.av==='number'?Math.min(MAX_QTY,p.av):MAX_QTY;
const capOf=id=>{const p=S.prod.items.find(x=>x.id===id);return p?maxQty(p):MAX_QTY};
/* Убирает из корзины то, чего больше нет в каталоге или что закончилось, и уменьшает количество до остатка. Возвращает, сколько позиций изменено. */
function pruneCart(){
  let n=0;
  Object.keys(S.cart).forEach(id=>{
    const p=S.prod.items.find(x=>x.id===id),q=Number(S.cart[id]);
    if(!p||soldOut(p)||!(q>=1)){delete S.cart[id];n++}
    else{const m=Math.min(maxQty(p),Math.floor(q));if(m!==q)n++;S.cart[id]=m}
  });
  if(n)saveCart();
  return n;
}
const cartLines=()=>S.prod.items.filter(p=>S.cart[p.id]>0).map(p=>({p,qty:S.cart[p.id]}));
const cartCount=()=>cartLines().reduce((s,l)=>s+l.qty,0);
/* цена за штуку зависит от количества (ступени), скидка от суммы, доставка: всё считается так же, как на сервере (общие функции unitPrice, orderDiscount, deliveryFee) */
const cartTotal=()=>cartLines().reduce((s,l)=>s+l.qty*unitPrice(l.p,l.qty),0);
const cartDisc=()=>orderDiscount(S.cfg,cartTotal());
const cartFee=()=>deliveryFee(S.cfg,mode(),cartTotal());
const cartPay=()=>cartTotal()-cartDisc().amount+cartFee();
const minOrder=()=>Number(S.cfg.shop.minOrder)||0;
/* Ставит количество в корзине (не больше остатка и 500). Возвращает, сколько в итоге стоит в корзине. */
function cartSet(id,q){
  const p=S.prod.items.find(x=>x.id===id),cap=p?maxQty(p):MAX_QTY;
  q=Math.max(0,Math.floor(q)||0);
  if(q>cap){
    q=cap;
    if(p&&typeof p.av==='number'&&p.av<MAX_QTY)toast(p.av>0?L('Осталось только '+p.av,'Faqat '+p.av+' ta qoldi'):L('Товар закончился','Mahsulot tugadi'));
  }
  if(q)S.cart[id]=q;else delete S.cart[id];
  saveCart();
  return q;
}
const lowTxt=n=>L('Мало (осталось '+n+')','Oz qoldi ('+n+' ta)');
const shopAddress=()=>L(S.cfg.shop.address,S.cfg.shop.addressUz||S.cfg.shop.address);
function activeMine(){return S.myOrders.filter(o=>o.status!=='done'&&o.status!=='cancelled').length}
function newCount(){return S.allOrders.filter(o=>o.status==='new').length}

/* language */
function initLang(){
  let l='';
  try{l=localStorage.getItem('sh-lang')||''}catch(e){}
  if(l!=='ru'&&l!=='uz'){
    let tl='';
    try{tl=String(S.tg&&S.tg.initDataUnsafe&&S.tg.initDataUnsafe.user&&S.tg.initDataUnsafe.user.language_code||'')}catch(e){}
    l=(tl||navigator.language||'').toLowerCase().indexOf('uz')===0?'uz':'ru';
  }
  setLang(l);
  document.documentElement.setAttribute('lang',LANG);
}
function switchLang(){
  const next=LANG==='ru'?'uz':'ru';
  setLang(next);
  try{localStorage.setItem('sh-lang',next)}catch(e){}
  document.documentElement.setAttribute('lang',next);
  render();
}

/* nav */
function renderNav(){
  const items=[['shop',L('Каталог','Katalog'),cartCount()],['mine',L('Заказы','Buyurtmalar'),activeMine()]];
  if(S.auth)items.push(['profile',L('Профиль','Profil')]);
  if(S.admin)items.push(['seller',L('Продавец','Sotuvchi'),newCount()]);
  const nav=$('#nav');
  nav.setAttribute('aria-label',L('Разделы','Boʻlimlar'));
  nav.innerHTML=items.map(i=>'<button type="button" data-act="nav" data-v="'+i[0]+'"'+(S.view===i[0]?' aria-current="page"':'')+'>'+i[1]+(i[2]?' <span class="badge">'+i[2]+'</span>':'')+'</button>').join('');
  const name=S.cfg.shop.name||DEFAULT.shop.name;
  $('#brandName').textContent=name;
  document.title=name;
  const lb=$('#langbtn');
  lb.textContent=LANG==='ru'?'UZ':'RU';
  lb.setAttribute('aria-label',L('Oʻzbek tiliga oʻtish','Переключить на русский'));
  lb.title=L('Oʻzbekcha','Русский');
}

/* ---------- каталог (клиент) ---------- */
const shopCats=()=>S.prod.cats.filter(c=>S.prod.items.some(p=>p.cat===c.id));
function qtyHTML(id,q,small){
  const i=esc(id),pre=small?'c':'p',cap=capOf(id);
  return '<div class="stepper'+(small?' sm':'')+'"><button type="button" data-act="'+pre+'minus" data-id="'+i+'" aria-label="'+esc(L('Меньше','Kamroq'))+'">−</button>'
    +'<input class="qty" type="number" inputmode="numeric" min="0" max="'+cap+'" value="'+q+'" data-qty="'+i+'" aria-label="'+esc(L('Количество','Miqdori'))+'">'
    +'<button type="button" data-act="'+pre+'plus" data-id="'+i+'" aria-label="'+esc(L('Больше','Koʻproq'))+'"'+(q>=cap?' disabled':'')+'>+</button></div>';
}
/* кнопки «+ блок», «+ коробка»: добавляют сразу целую упаковку (цена за штуку, количество в штуках) */
function packChips(p,pre){
  const out=['blk','box'].filter(k=>packSize(p,k)).map(k=>{
    const n=packSize(p,k),lab=L('Добавить: '+packWord(k)+' ('+n+' шт)','Qoʻshish: '+packWord(k)+' ('+n+' dona)');
    return '<button type="button" class="chip" data-act="'+pre+'pack" data-id="'+esc(p.id)+'" data-k="'+k+'" aria-label="'+esc(lab)+'">+ '+esc(packWord(k))+' · '+n+'</button>';
  }).join('');
  return out?'<div class="ppack">'+out+'</div>':'';
}
function productCtl(p){
  if(soldOut(p))return '<button type="button" class="btn ghost sm padd" disabled>'+L('Нет в наличии','Mavjud emas')+'</button>';
  const q=S.cart[p.id]||0;
  if(!q)return '<button type="button" class="btn sm padd" data-act="padd" data-id="'+esc(p.id)+'">'+L('В корзину','Savatga')+'</button>'+packChips(p,'p');
  return qtyHTML(p.id,q,false)+packChips(p,'p');
}
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.4 3.3 4.2 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>';
const isFav=id=>S.fav.includes(id);
const favBtn=id=>S.auth?'<button type="button" class="fav" data-act="fav" data-id="'+esc(id)+'" aria-pressed="'+isFav(id)+'" aria-label="'+esc(L('В избранное','Sevimlilarga'))+'">'+HEART+'</button>':'';
/* ступени цены под ценой: «от 10 шт — 7 000 сум»; та, что сейчас действует по корзине, выделена */
function tiersHTML(p,q){
  const t=tiersOf(p);
  if(!t.length)return '';
  let act=-1;t.forEach((x,i)=>{if(q>=x.n)act=i});
  return t.map((x,i)=>'<span class="ptier'+(i===act?' on':'')+'">'+L('от '+x.n+' шт — ',x.n+' donadan — ')+money(x.price)+'</span>').join('');
}
function priceHTML(p){
  const q=S.cart[p.id]||0,eff=unitPrice(p,q||1),tier=eff<Number(p.price);
  const o=tier?Number(p.price):oldPrice(p),pc=o?Math.max(1,Math.min(99,Math.round((o-eff)/o*100))):0;
  return (o?'<span class="pold">'+money(o)+'</span>':'')+money(eff)+(pc?'<span class="psale">−'+pc+'%</span>':'')+tiersHTML(p,q);
}
function productCard(p){
  const off=soldOut(p),d=prodDesc(p),w=weightLabel(p);
  const status=off?'':(p.lw&&typeof p.av==='number'?'<div class="pst low">'+esc(lowTxt(p.av))+'</div>':'<div class="pst">'+L('В наличии','Mavjud')+'</div>');
  return '<article class="pcard'+(off?' off':'')+'" id="pc-'+esc(p.id)+'"><div class="pimg">'+pimg(p)+(off?'<span class="tag">'+L('Нет в наличии','Mavjud emas')+'</span>':(p.tag?'<span class="lbl '+esc(p.tag)+'">'+esc(tagName(p.tag))+'</span>':''))+favBtn(p.id)+'</div>'
    +'<div class="pbody"><div class="pname">'+esc(nm(p))+'</div>'+(w?'<div class="pw">'+esc(w)+'</div>':'')+status
    +(d?'<div class="pdesc" data-act="pdesc">'+esc(d)+'</div>':'')
    +'<div class="pprice">'+priceHTML(p)+'</div><div class="pctl">'+productCtl(p)+'</div></div></article>';
}
/* Поиск по названию, описанию и весу на обоих языках: каждое слово запроса должно встретиться. */
const normQ=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[ʻʼ’‘`']/g,'');
function matchQ(p,q){
  const words=normQ(q).split(/\s+/).filter(Boolean);
  if(!words.length)return true;
  const hay=normQ([p.name,p.uz,p.desc,p.descUz,weightLabel(p)].join(' '));
  return words.every(w=>hay.indexOf(w)>=0);
}
/* особые разделы рядом с категориями: избранное, акции, новинки */
function shopSpecials(){
  const out=[];
  if(S.auth&&S.fav.some(id=>S.prod.items.some(p=>p.id===id)))out.push(['fav','★ '+L('Избранное','Sevimlilar')]);
  if(S.prod.items.some(p=>p.tag==='sale'))out.push(['sale',tagName('sale')]);
  if(S.prod.items.some(p=>p.tag==='new'))out.push(['new',tagName('new')]);
  return out;
}
const inShopFilter=p=>S.shopCat==='all'?true:S.shopCat==='fav'?isFav(p.id):S.shopCat==='sale'?p.tag==='sale':S.shopCat==='new'?p.tag==='new':p.cat===S.shopCat;
/* Сетка товаров: по выбранной категории и поиску. В режиме «Все» без поиска товары идут разделами по категориям. */
function paintGrid(){
  const g=$('#pgrid');if(!g)return;
  const q=S.q.trim();
  const items=S.prod.items.filter(p=>inShopFilter(p)&&matchQ(p,q));
  if(!items.length){
    g.innerHTML=S.shopCat==='fav'&&!q?'<div class="empty"><b>'+L('В избранном пока пусто','Sevimlilar hozircha boʻsh')+'</b>'+L('Нажмите на сердечко у товара, и он появится здесь.','Mahsulotdagi yurakchani bosing, u shu yerda paydo boʻladi.')+'</div>'
      :'<div class="empty"><b>'+L('Ничего не найдено','Hech narsa topilmadi')+'</b>'+L('Измените запрос или выберите другую категорию.','Soʻrovni oʻzgartiring yoki boshqa kategoriyani tanlang.')+'</div>';
    return;
  }
  const cats=shopCats();
  if(S.shopCat==='all'&&!q&&cats.length>=1){
    const rest=items.filter(p=>!cats.some(c=>c.id===p.cat));
    g.innerHTML=cats.map(c=>{const li=items.filter(p=>p.cat===c.id);return li.length?'<h2 class="chead">'+esc(nm(c))+'</h2><div class="pgrid">'+li.map(productCard).join('')+'</div>':''}).join('')
      +(rest.length?'<div class="pgrid" style="margin-top:20px">'+rest.map(productCard).join('')+'</div>':'');
  }else g.innerHTML='<div class="pgrid">'+items.map(productCard).join('')+'</div>';
}
function paintShopBar(){
  const bar=$('#bar');if(!bar)return;
  const n=cartCount();
  if(!n){bar.style.display='none';bar.innerHTML='';return}
  bar.style.display='';
  if(S.shopStep==='cart')bar.innerHTML='<div class="wrap"><div><small>'+L('Итого, оплата при получении','Jami, olganda toʻlanadi')+'</small><strong id="ctotal">'+money(cartPay())+'</strong></div><button type="button" class="btn" data-act="submitorder">'+L('Заказать','Buyurtma berish')+'</button></div>';
  else bar.innerHTML='<div class="wrap"><div><small>'+L('Корзина','Savat')+': '+n+' '+L('шт.','dona')+'</small><strong>'+money(cartTotal()-cartDisc().amount)+'</strong></div><button type="button" class="btn" data-act="opencart">'+L('Оформить заказ','Buyurtma berish')+'</button></div>';
}
function renderShop(){
  if(S.shopPlaced)return renderShopPlaced();
  if(!S.prod.items.length){
    view.innerHTML='<div class="wrap page"><div class="empty"><b>'+L('Каталог пока пуст','Katalog hozircha boʻsh')+'</b>'+L('Загляните позже.','Keyinroq qaytib keling.')+'</div></div>';
    return;
  }
  if(S.shopStep==='cart'&&cartCount()>0)return renderCart();
  S.shopStep='list';
  const cats=shopCats();
  const specials=shopSpecials();
  if(S.shopCat!=='all'&&!cats.some(c=>c.id===S.shopCat)&&!specials.some(x=>x[0]===S.shopCat))S.shopCat='all';
  const chips=cats.length>1||specials.length?'<div class="pchips" role="group" aria-label="'+esc(L('Категории','Kategoriyalar'))+'">'
    +[['all',L('Все','Barchasi')]].concat(specials,cats.length>1?cats.map(c=>[c.id,nm(c)]):[]).map(c=>'<button type="button" class="chip" data-act="scat" data-id="'+esc(c[0])+'" aria-pressed="'+(S.shopCat===c[0])+'">'+esc(c[1])+'</button>').join('')+'</div>':'';
  const search=S.prod.items.length>8?'<div class="search"><input type="search" id="q" value="'+esc(S.q)+'" placeholder="'+esc(L('Поиск по названию и описанию','Nomi va tavsifi boʻyicha qidirish'))+'" autocomplete="off" aria-label="'+esc(L('Поиск по названию и описанию','Nomi va tavsifi boʻyicha qidirish'))+'"></div>':'';
  view.innerHTML='<div class="wrap shop"><div class="eyebrow">'+L('Каталог','Katalog')+'</div><h1>'+esc(S.cfg.shop.name||DEFAULT.shop.name)+'</h1>'+search+chips+'<div id="pgrid"></div></div><div class="bar" id="bar"></div>';
  paintGrid();paintShopBar();
}
function toggleFav(id){
  if(!S.auth)return;
  S.fav=isFav(id)?S.fav.filter(x=>x!==id):S.fav.concat([id]).slice(-100);
  S.favSeq++;
  document.querySelectorAll('.fav[data-id="'+CSS.escape(id)+'"]').forEach(b=>b.setAttribute('aria-pressed',String(isFav(id))));
  if(S.view==='shop'&&!S.shopPlaced&&S.shopStep==='list'){
    const sp=shopSpecials();
    if(S.shopCat==='fav'&&!sp.some(x=>x[0]==='fav')){S.shopCat='all';renderShop()}
    else if(S.shopCat==='fav')paintGrid();
    else{const had=!!document.querySelector('[data-act="scat"][data-id="fav"]');if(had!==sp.some(x=>x[0]==='fav'))renderShop()}
  }
  clearTimeout(S.favT);S.favT=setTimeout(pushFav,600);
}
async function pushFav(){
  const seq=S.favSeq,r=await api('PUT','/api/fav',{ids:S.fav});
  if(!r.ok||!r.data){toast(L('Избранное не сохранилось. Проверьте соединение.','Sevimlilar saqlanmadi. Ulanishni tekshiring.'));return}
  if(S.favSeq===seq&&JSON.stringify(r.data.fav)!==JSON.stringify(S.fav)){S.fav=r.data.fav;if(S.view==='shop')renderShop()}
}
function paintShopCtl(id){
  const p=S.prod.items.find(x=>x.id===id),el=document.querySelector('#pc-'+CSS.escape(id)+' .pctl'),pe=document.querySelector('#pc-'+CSS.escape(id)+' .pprice');
  if(p&&el)el.innerHTML=productCtl(p);
  if(p&&pe)pe.innerHTML=priceHTML(p);
  paintShopBar();renderNav();
}
/* под названием в корзине: вес и цена за штуку (со ступенью), подсказка про следующую ступень, сколько это упаковок */
function cartInfoHTML(p,q){
  const w=weightLabel(p),eff=unitPrice(p,q),nt=nextTier(p,q),pk=packText(p,q);
  return '<small>'+(w?esc(w)+' · ':'')+(eff<Number(p.price)?'<span class="pold">'+money(p.price)+'</span>':'')+money(eff)+'</small>'
    +(nt?'<small class="tiernext">'+esc(L('Ещё '+nt.left+' шт — цена '+money(nt.price)+' за шт','Yana '+nt.left+' dona — narx '+money(nt.price)))+'</small>':'')
    +(pk?'<small class="packtxt">'+esc(pk)+'</small>':'');
}
function paintCartLines(){
  const el=$('#clines');if(!el)return;
  el.innerHTML=cartLines().map(l=>{
    const p=l.p;
    return '<div class="cline" id="cl-'+esc(p.id)+'"><div class="cth">'+pimg(p)+'</div><div class="cn"><b>'+esc(nm(p))+'</b><div id="ci-'+esc(p.id)+'">'+cartInfoHTML(p,l.qty)+'</div>'
      +(p.lw&&typeof p.av==='number'?'<small class="lowtxt">'+esc(lowTxt(p.av))+'</small>':'')+'</div>'
      +'<div class="cr">'+qtyHTML(p.id,l.qty,true)+'<div class="cs">'+money(l.qty*unitPrice(p,l.qty))+'</div></div>'+packChips(p,'c')+'</div>';
  }).join('');
  paintCartSum();
}
/* Блок «Итого» в корзине: товары, доставка (если она платная), итог, подсказки про минимум и бесплатную доставку. */
function paintCartSum(){
  const el=$('#csum');if(!el)return;
  const sub=cartTotal(),dc=cartDisc(),fee=cartFee(),sh=S.cfg.shop,del=mode()==='delivery',feeSet=Number(sh.deliveryFee)>0,free=Number(sh.freeDeliveryFrom)||0;
  const showFee=del&&feeSet;
  el.innerHTML=(showFee||dc.amount>0?'<div class="r"><span>'+L('Товары','Mahsulotlar')+'</span><span id="csubrow">'+money(sub)+'</span></div>':'')
    +(dc.amount>0?'<div class="r disc"><span>'+L('Скидка '+dc.pct+'%','Chegirma '+dc.pct+'%')+'</span><span id="cdiscrow">−'+money(dc.amount)+'</span></div>':'')
    +(showFee?'<div class="r"><span>'+L('Доставка','Yetkazib berish')+'</span><span id="cfeerow">'+(fee>0?money(fee):L('бесплатно','bepul'))+'</span></div>':'')
    +'<div class="r t"><span>'+L('Итого','Jami')+'</span><span id="ctotalrow">'+money(cartPay())+'</span></div>';
  const m=$('#cmin');if(!m)return;
  const min=minOrder(),notes=[];
  if(min>0&&sub<min)notes.push('<div class="note warnnote" role="status">'+L('Минимальная сумма заказа: '+money(min)+'. Добавьте товаров ещё на '+money(min-sub)+'.','Buyurtmaning minimal summasi: '+money(min)+'. Yana '+money(min-sub)+' lik mahsulot qoʻshing.')+'</div>');
  if(showFee&&fee>0&&free>sub)notes.push('<div class="note" role="status">'+L('До бесплатной доставки осталось '+money(free-sub)+'.','Bepul yetkazib berishgacha '+money(free-sub)+' qoldi.')+'</div>');
  const nd=nextDiscount(S.cfg,sub);
  if(nd)notes.push('<div class="note" role="status">'+L('Добавьте товаров ещё на '+money(nd.left)+': скидка на заказ будет '+nd.pct+'%.','Yana '+money(nd.left)+' lik mahsulot qoʻshing: buyurtmaga '+nd.pct+'% chegirma boʻladi.')+'</div>');
  m.innerHTML=notes.length?'<div class="stack" style="margin-top:12px">'+notes.join('')+'</div>':'';
  paintShopBar();
}
/* Меняет суммы на экране, не перерисовывая поле, в которое клиент печатает количество. */
function refreshTotals(id){
  const p=S.prod.items.find(x=>x.id===id),line=document.querySelector('#cl-'+CSS.escape(id)+' .cs'),info=document.getElementById('ci-'+id);
  if(p&&line)line.textContent=money((S.cart[id]||0)*unitPrice(p,S.cart[id]||0));
  if(p&&info)info.innerHTML=cartInfoHTML(p,S.cart[id]||0);
  const cap=capOf(id);
  document.querySelectorAll('[data-act="pplus"],[data-act="cplus"]').forEach(b=>{if(b.dataset.id===id)b.disabled=(S.cart[id]||0)>=cap});
  paintCartSum();paintShopBar();renderNav();
}

/* сохранённые адреса из профиля: нажал и адрес подставился */
function addrChips(){
  const a=S.profile&&S.profile.addrs;
  if(!a||!a.length)return '';
  return '<div class="achips" id="achips" role="group" aria-label="'+esc(L('Сохранённые адреса','Saqlangan manzillar'))+'">'+a.map((x,i)=>'<button type="button" class="chip" data-act="addr" data-i="'+i+'" aria-pressed="'+(S.form.address.trim().toLowerCase()===x.toLowerCase())+'">'+esc(x)+'</button>').join('')+'</div>';
}
function markAddr(){
  const cur=S.form.address.trim().toLowerCase();
  document.querySelectorAll('#achips .chip').forEach(b=>{const x=S.profile&&S.profile.addrs[Number(b.dataset.i)];b.setAttribute('aria-pressed',String(!!x&&x.toLowerCase()===cur))});
}
function fillTimes(){
  const sel=$('#f-time');if(!sel)return;
  const list=S.form.date?pickup().slots(S.form.date):[];
  if(!list.includes(S.form.time))S.form.time='';
  sel.innerHTML='<option value="">'+(list.length?L('Выберите время','Vaqtni tanlang'):L('На эту дату нет свободного времени','Bu sanaga boʻsh vaqt yoʻq'))+'</option>'+list.map(t=>'<option value="'+t+'"'+(t===S.form.time?' selected':'')+'>'+t+'</option>').join('');
}

const tgLink=o=>{

const discRow=(o,cls)=>o.disc>0?'<div class="'+cls+'"><span>'+L('Скидка '+o.dpct+'%','Chegirma '+o.dpct+'%')+'</span><span>−'+money(o.disc)+'</span></div>':'';

function validate(){
  const e={},f=S.form;
  if(!f.name.trim())e.name=L('Укажите имя','Ismingizni kiriting');
  if(f.phone.replace(/\D/g,'').length<9)e.phone=L('Укажите номер телефона','Telefon raqamini kiriting');
  if(mode()==='delivery'&&f.address.trim().length<5)e.address=L('Укажите адрес доставки','Yetkazib berish manzilini kiriting');
  if(!f.date)e.date=L('Выберите дату','Sanani tanlang');
  if(f.date&&!f.time)e.time=L('Выберите время','Vaqtni tanlang');
  return e;
}
const FIELDS=['name','phone','address','date','time'];
function orderErrText(er){
  return {
    too_many:L('У вас уже есть несколько неподтверждённых заказов. Дождитесь ответа продавца.','Sizda tasdiqlanmagan buyurtmalar bor. Sotuvchi javobini kuting.'),
    pickup:L('Это время уже недоступно. Выберите другое.','Bu vaqt endi mavjud emas. Boshqasini tanlang.'),
    auth:L('Сессия устарела. Закройте и снова откройте приложение в боте.','Seans eskirdi. Ilovani yopib, botdan qayta oching.'),
    expired:L('Сессия устарела. Закройте и снова откройте приложение в боте.','Seans eskirdi. Ilovani yopib, botdan qayta oching.'),
    busy:L('Сейчас много заказов. Попробуйте чуть позже.','Hozir buyurtmalar koʻp. Birozdan keyin urinib koʻring.'),
    blocked:blockedTxt()
  }[er]||L('Не удалось отправить заказ. Проверьте соединение и попробуйте ещё раз.','Buyurtmani yuborib boʻlmadi. Ulanishni tekshirib, qayta urinib koʻring.');
}
async function submitOrder(){
  if(S.busy)return;
  const lines=cartLines();
  if(!lines.length){S.shopStep='list';renderShop();return}
  const e=validate();
  FIELDS.forEach(k=>{
    const el=$('#e-'+k),inp=$('#f-'+k);
    if(el)el.textContent=e[k]||'';
    if(inp)inp.setAttribute('aria-invalid',e[k]?'true':'false');
  });
  const first=FIELDS.find(k=>e[k]);
  if(first){const inp=$('#f-'+first);if(inp){inp.focus();try{inp.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}}return}
  if(!S.auth){toast(L('Откройте приложение через бота в Telegram, чтобы оформить заказ','Buyurtma berish uchun ilovani Telegramdagi bot orqali oching'));return}
  if(S.blocked){toast(blockedTxt());return}
  if(minOrder()>0&&cartTotal()<minOrder()){
    toast(L('Минимальная сумма заказа: '+money(minOrder()),'Buyurtmaning minimal summasi: '+money(minOrder())));
    const m=$('#cmin');if(m)try{m.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}
    return;
  }
  S.busy=true;
  const btn=$('#submit');if(btn){btn.disabled=true;btn.textContent=L('Отправляем…','Yuborilmoqda…')}
  const f=S.form,del=mode()==='delivery';
  const r=await api('POST','/api/order',{
    cart:lines.map(l=>({id:l.p.id,qty:l.qty})),
    form:{name:f.name.trim(),phone:f.phone.trim(),mode:mode(),address:del?f.address.trim():'',date:f.date,time:f.time,comment:f.comment.trim()},
    lang:LANG,expectTotal:cartPay()
  });
  S.busy=false;
  if(!r.ok){
    const er=r.data&&r.data.error;
    if(r.data&&r.data.cfg){S.cfg=mergeCfg(r.data.cfg);normalizeMode()}
    if(r.data&&r.data.prod)S.prod=normProd(r.data.prod);
    if(er==='stock'){
      /* товара меньше, чем в корзине: показываем, сколько осталось, и уменьшаем корзину */
      const short=Array.isArray(r.data.short)?r.data.short:[];
      const what=short.slice(0,3).map(s=>{
        const p=S.prod.items.find(x=>x.id===s.id),n=Number(s.avail)||0;
        return (p?nm(p):'')+': '+(n>0?L('осталось '+n,'faqat '+n+' ta qoldi'):L('нет в наличии','mavjud emas'));
      }).join('; ')+(short.length>3?'…':'');
      short.forEach(s=>{
        const n=Number(s.avail)||0;
        if(n<=0)delete S.cart[s.id];else if((S.cart[s.id]||0)>n)S.cart[s.id]=n;
      });
      saveCart();pruneCart();
      S.shopStep=cartCount()?'cart':'list';
      renderNav();renderShop();
      toast(L('Столько товара нет на складе. '+what+'. Мы обновили корзину.','Omborda buncha mahsulot yoʻq. '+what+'. Savatni yangiladik.'));
      return;
    }
    if(er==='min_order'){
      renderShop();
      toast(L('Минимальная сумма заказа: '+money(Number(r.data.min)||minOrder()),'Buyurtmaning minimal summasi: '+money(Number(r.data.min)||minOrder())));
      return;
    }
    if(er==='price_changed'||er==='unavailable'||er==='no_delivery'){
      pruneCart();
      S.shopStep=cartCount()?'cart':'list';
      renderNav();renderShop();
      toast(er==='price_changed'?L('Продавец обновил цены. Проверьте сумму и оформите заказ ещё раз.','Sotuvchi narxlarni yangiladi. Summani tekshirib, qaytadan buyurtma bering.')
        :er==='no_delivery'?L('Доставка сейчас недоступна. Выберите самовывоз.','Hozir yetkazib berish mavjud emas. Olib ketishni tanlang.')
        :L('Что-то из корзины закончилось, мы обновили её. Проверьте заказ и оформите ещё раз.','Savatdagi baʼzi narsalar tugadi, savatni yangiladik. Buyurtmani tekshirib, qaytadan bering.'));
      return;
    }
    if(er==='blocked')S.blocked=true;
    renderShop();toast(orderErrText(er));
    return;
  }
  const order=r.data.order;
  S.cart={};saveCart();
  S.shopPlaced={order};S.shopStep='list';
  S.myOrders=[order].concat(S.myOrders.filter(o=>o.id!==order.id));
  S.form.comment='';
  if(!S.profile)S.profile={name:order.name,phone:order.phone,org:'',addrs:order.mode==='delivery'&&order.address?[order.address]:[]};
  else{
    if(!S.profile.name)S.profile.name=order.name;
    if(!S.profile.phone)S.profile.phone=order.phone;
    if(order.mode==='delivery'&&order.address&&S.profile.addrs.length<5&&!S.profile.addrs.some(a=>a.toLowerCase()===order.address.toLowerCase()))S.profile.addrs=S.profile.addrs.concat([order.address]);
  }
  try{S.tg&&S.tg.HapticFeedback&&S.tg.HapticFeedback.notificationOccurred('success')}catch(x){}
  renderNav();renderShop();
  window.scrollTo(0,0);
}

/* общая проверка полей клиента на телефоне; возвращает {v} или {e:{поле:текст}} */
function checkClientFields(get){
  const e={},v={name:get('name').trim(),phone:get('phone').trim(),org:get('org').trim()};
  if(v.phone&&(v.phone.replace(/\D/g,'').length<9||v.phone.replace(/\D/g,'').length>15))e.phone=L('Проверьте номер телефона','Telefon raqamini tekshiring');
  const lines=get('addrs').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),addrs=[];
  lines.forEach(x=>{if(!addrs.some(y=>y.toLowerCase()===x.toLowerCase()))addrs.push(x)});
  if(addrs.some(x=>x.length<5))e.addrs=L('Адрес слишком короткий','Manzil juda qisqa');
  else if(addrs.length>5)e.addrs=L('Можно сохранить не больше 5 адресов','5 tadan ortiq manzil saqlab boʻlmaydi');
  v.addrs=addrs;
  return Object.keys(e).length?{e}:{v};
}

async function saveProfile(){

}

async function importFile(file){
  if(S.impBusy||!S.admin)return;
  if(file.size>1000000){toast(impWhy('too_big'));return}
  S.impBusy=true;S.imp={busy:true};paintSeller();
  await flushSave();   // сначала уходят несохранённые правки каталога
  let bytes;
  try{bytes=new Uint8Array(await file.arrayBuffer())}catch(e){S.impBusy=false;S.imp=null;paintSeller();toast(impWhy(''));return}
  const r=await apiBin('POST','/api/admin/import',bytes,'application/octet-stream');
  S.impBusy=false;
  if(!r.ok||!r.data||!r.data.summary){S.imp=null;paintSeller();toast(r.data&&r.data.why?impWhy(r.data.why):L('Не удалось прочитать файл. Проверьте соединение.','Faylni oʻqib boʻlmadi. Ulanishni tekshiring.'));return}
  S.imp={bytes,res:r.data};paintSeller();
  try{document.getElementById('impsum').scrollIntoView({block:'center'})}catch(e){}
}
async function impApply(){
  if(S.impBusy||!S.imp||!S.imp.bytes)return;
  S.impBusy=true;paintSeller();
  await flushSave();
  const r=await apiBin('POST','/api/admin/import?apply=1',S.imp.bytes,'application/octet-stream');
  S.impBusy=false;
  if(!r.ok||!r.data||!r.data.summary){paintSeller();toast(L('Не удалось применить прайс. Проверьте соединение и попробуйте ещё раз.','Prays qoʻllanmadi. Ulanishni tekshirib, qayta urining.'));return}
  const sm=r.data.summary;
  if(r.data.prod){S.prod=normProd(r.data.prod);applyStk();pruneCart()}
  S.imp=null;paintSeller();renderNav();
  toast(L('Готово: добавлено '+sm.added+', изменено '+sm.updated+'.','Tayyor: '+sm.added+' ta qoʻshildi, '+sm.updated+' ta oʻzgardi.'));
}

/* состояние учёта товара: none (не ведётся), ok, low (мало), out (свободного нет) */
function stState(p){
  const s=S.stk[p.id];
  if(!s)return 'none';
  const a=stkAvail(s);
  return a===0?'out':(s.low>0&&a<=s.low?'low':'ok');
}
/* переносит остатки в каталог на экране, чтобы продавец видел витрину так же, как клиент */
function applyStk(){
  S.prod.items.forEach(p=>{
    const v=stkPublic(S.stk[p.id],MAX_QTY);
    delete p.av;delete p.lw;
    if(v){p.av=v.av;if(v.lw)p.lw=1}
  });
}
function statsHTML(){
  const c={none:0,ok:0,low:0,out:0};
  S.prod.items.forEach(p=>{c[stState(p)]++});
  const st=(lab,v,hot)=>'<div class="stat'+(hot?' hot':'')+'"><small>'+lab+'</small><b>'+v+'</b></div>';
  return st(L('Под учётом','Hisobda'),c.ok+c.low+c.out)+st(L('Без учёта','Hisobsiz'),c.none)+st(L('Заканчивается','Tugayapti'),c.low,c.low>0)+st(L('Нет свободного','Boʻshi yoʻq'),c.out,c.out>0);
}

async function loadStock(){
  if(!S.admin)return;
  const r=await api('GET','/api/admin/stock');
  if(!r.ok||!r.data||!r.data.stk)return;
  const first=!S.stkLoaded;
  S.stkLoaded=true;
  if(!first&&JSON.stringify(r.data.stk)===JSON.stringify(S.stk))return;
  S.stk=r.data.stk;applyStk();
  if(S.view!=='seller')return;
  paintTabs();
  if(S.sellerTab==='stock'){
    const ae=document.activeElement,b=$('#sbody');
    if(ae&&b&&b.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;   // не мешаем, пока продавец вводит число
    paintStock();
  }
}
async function loadJournal(){
  const r=await api('GET','/api/admin/journal');
  if(r.ok&&r.data&&Array.isArray(r.data.jr))S.jr=r.data.jr;
  const el=$('#jrbody');if(el&&S.jrOpen)el.innerHTML=jrHTML();
}
/* целое число из поля; при ошибке подсказывает и возвращает null */
function stockNum(id,k,min){
  const el=document.getElementById(k+'-'+id),raw=el?String(el.value).trim():'';
  if(raw===''){toast(L('Введите количество','Miqdorni kiriting'));if(el)el.focus();return null}
  const n=Number(raw);
  if(!Number.isInteger(n)||n<min||n>1000000){
    toast(min>0?L('Введите целое число от 1','1 dan boshlab butun son kiriting'):L('Введите целое число, 0 или больше','Butun son kiriting (0 yoki koʻp)'));
    if(el)el.focus();
    return null;
  }
  return n;
}
/* soft: порог сохраняется тихо, строку не перерисовываем, пока продавец печатает в ней другое число */
async function stockDo(id,body,okMsg,soft){
  if(S.sbusy[id]||!S.auth||!S.admin)return;
  S.sbusy[id]=true;
  if(!soft)paintStockRow(id);
  await flushSave();   // товар должен уже быть на сервере
  const r=await api('POST','/api/admin/stock',Object.assign({id:id},body));
  delete S.sbusy[id];
  if(r.ok&&r.data&&r.data.stk){S.stk=r.data.stk;S.stkLoaded=true;applyStk();toast(okMsg)}
  else toast(r.status===404?L('Такого товара уже нет','Bunday mahsulot endi yoʻq'):L('Не удалось сохранить. Проверьте соединение.','Saqlab boʻlmadi. Ulanishni tekshiring.'));
  const row=document.getElementById('srow-'+id),ae=document.activeElement;
  if(!soft||!(row&&ae&&row.contains(ae)))paintStockRow(id);
  else{const st=$('#sstats');if(st)st.innerHTML=statsHTML();paintTabs()}
  if(S.jrOpen)loadJournal();
}

const RP_DAYS=[7,30,90,365];
const MO_S_RU=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],MO_S_UZ=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const MO_F_RU=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const dShort=d=>{const m=Number(d.slice(5,7))-1,n=Number(d.slice(8,10));return LANG==='uz'?n+'-'+UZ_MO[m]:n+' '+MO_S_RU[m]};
const fDay=d=>d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const mFull=m=>{const i=Number(m.slice(5,7))-1;return (LANG==='uz'?UZ_MO[i]:MO_F_RU[i])+' '+m.slice(0,4)};
const mShort=m=>{const i=Number(m.slice(5,7))-1;return LANG==='uz'?MO_S_UZ[i]:MO_S_RU[i]};
const rpRange=d=>({7:L('7 дней','7 kun'),30:L('30 дней','30 kun'),90:L('3 месяца','3 oy'),365:L('Год','Yil')})[d];
function ruPl(n,a){const m=n%100,k=n%10;return m>=11&&m<=14?a[2]:k===1?a[0]:k>=2&&k<=4?a[1]:a[2]}
const ordTxt=n=>LANG==='uz'?n+' ta buyurtma':n+' '+ruPl(n,['заказ','заказа','заказов']);
/* подписи на оси: 1,2 млн / 500 тыс */
function cCompact(v){
  v=Math.round(v);
  const f=x=>String(Math.round(x*10)/10).replace('.',',');
  return v>=1e9?f(v/1e9)+' '+L('млрд','mlrd'):v>=1e6?f(v/1e6)+' '+L('млн','mln'):v>=1e3?f(v/1e3)+' '+L('тыс','ming'):String(v);
}
/* верх шкалы: круглое число, чтобы половина тоже была круглой */
function niceMax(v){
  if(!(v>0))return 1;
  const pow=Math.pow(10,Math.floor(Math.log10(v))),m=v/pow;
  return [1,2,4,6,8,10].find(x=>m<=x+1e-9)*pow;
}
/* столбцы: до месяца — дни, три месяца — недели, год — месяцы */
function repBuckets(r){
  const ser=r.series,sum=(g,k)=>g.reduce((a,x)=>a+x[k],0);
  if(r.days<=30)return ser.map(x=>({n:x.n,sum:x.sum,full:dShort(x.d),ax:dShort(x.d)}));
  const out=[];
  if(r.days<=90){
    for(let i=0;i<ser.length;i+=7){const g=ser.slice(i,i+7);out.push({n:sum(g,'n'),sum:sum(g,'sum'),full:dShort(g[0].d)+(g.length>1?' – '+dShort(g[g.length-1].d):''),ax:dShort(g[0].d)})}
    return out;
  }
  const mp=new Map();
  ser.forEach(x=>{const k=x.d.slice(0,7),g=mp.get(k)||{m:k,n:0,sum:0};g.n+=x.n;g.sum+=x.sum;mp.set(k,g)});
  mp.forEach(g=>out.push({n:g.n,sum:g.sum,full:mFull(g.m),ax:mShort(g.m)}));
  return out;
}

function repIdx(e){
  const box=e.target&&e.target.closest?e.target.closest('.rcols'):null;
  if(!box||!S.rep.data)return -1;
  const rc=box.getBoundingClientRect(),n=box.children.length;
  if(!rc.width||!n)return -1;
  return Math.max(0,Math.min(n-1,Math.floor((e.clientX-rc.left)/rc.width*n)));
}
document.addEventListener('pointermove',e=>{
  const i=repIdx(e);

  S.rep.hov=i;repShow(i);
  if(e.pointerType==='touch')S.rep.drag=true;
});
document.addEventListener('pointerup',e=>{
  if(e.pointerType==='touch'&&S.rep.drag){S.rep.drag=false;S.rep.sel=S.rep.hov;S.rep.skip=Date.now()}
});
document.addEventListener('pointerout',e=>{

function agoTxt(iso){
  const t=new Date(iso).getTime();
  if(isNaN(t))return '';
  const d=Math.floor((Date.now()-t)/86400000);
  if(d<=0)return L('сегодня','bugun');
  if(d===1)return L('вчера','kecha');
  if(d<60)return L(d+' дн. назад',d+' kun oldin');
  return jrDate(iso);
}

  if(!l){paintClients();return}
  l.innerHTML=clientListHTML();

async function loadClients(){
  if(!S.admin)return;
  const r=await api('GET','/api/admin/clients');
  if(!r.ok||!r.data||!Array.isArray(r.data.clients))return;
  const first=!S.clLoaded;
  S.clLoaded=true;
  if(!first&&JSON.stringify(r.data.clients)===JSON.stringify(S.cl))return;
  S.cl=r.data.clients;
  if(S.view!=='seller'||S.sellerTab!=='clients')return;
  if($('#ced'))return;   // карточка открыта: не затираем то, что продавец печатает; список обновится, когда её закроют
  const ae=document.activeElement;
  if(ae&&ae.id==='cq'){paintClientList();return}
  paintClients();
}
async function loadClientDetail(uid){
  const r=await api('GET','/api/admin/clients/'+uid);
  if(!r.ok||!r.data)return;
  S.cDet[uid]=r.data.orders||[];
  const el=$('#cord');
  if(el&&S.cOpen===uid)el.innerHTML=clientOrdersHTML(uid);
}
function toggleClient(uid){
  S.cOpen=S.cOpen===uid?null:uid;S.cDel=null;
  paintClientList();
  if(S.cOpen!==null){
    loadClientDetail(uid);
    const row=document.getElementById('clrow-'+uid);
    if(row)try{row.scrollIntoView({block:'nearest'})}catch(x){}

}
async function saveClient(uid){
  if(S.cBusy)return;
  const get=k=>{const el=document.getElementById('ce-'+k);return el?String(el.value):''};
  const c=checkClientFields(get);
  const er=document.getElementById('cee-addrs');if(er)er.textContent=(c.e&&c.e.addrs)||'';
  if(c.e){
    if(c.e.phone){toast(c.e.phone);const el=document.getElementById('ce-phone');if(el)el.focus()}
    else{const el=document.getElementById('ce-addrs');if(el)el.focus()}
    return;
  }
  const blk=document.getElementById('ce-blocked');
  const body=Object.assign({},c.v,{grp:get('grp').trim(),note:get('note').trim(),blocked:!!(blk&&blk.checked)});
  S.cBusy=true;
  const btn=document.querySelector('[data-act="csave"]');if(btn)btn.disabled=true;
  const r=await api('PUT','/api/admin/clients/'+uid,body);
  S.cBusy=false;
  if(btn)btn.disabled=false;
  if(!r.ok||!r.data||!r.data.client){toast(r.status===404?L('Клиента уже нет в базе','Mijoz endi bazada yoʻq'):clientErrText(r.data&&r.data.error));return}
  const i=S.cl.findIndex(x=>x.uid===uid);
  if(i>=0)S.cl[i]=r.data.client;
  toast(L('Клиент сохранён','Mijoz saqlandi'));
  paintClientList();
}
async function deleteClient(uid){
  const r=await api('DELETE','/api/admin/clients/'+uid);
  if(!r.ok){toast(clientErrText(r.data&&r.data.error));return}
  S.cl=S.cl.filter(c=>c.uid!==uid);S.cOpen=null;S.cDel=null;delete S.cDet[uid];
  toast(L('Клиент удалён из базы. Его заказы остались.','Mijoz bazadan oʻchirildi. Buyurtmalari qoldi.'));
  paintClients();
}

/* Сжимает фото на телефоне: JPEG, длинная сторона ~800 px, до ~280 КБ. */
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
    const w=img.naturalWidth,h=img.naturalHeight;
    if(!w||!h)return null;
    let k=Math.min(1,800/Math.max(w,h));
    for(let attempt=0;attempt<4;attempt++){
      const cw=Math.max(64,Math.round(w*k)),ch=Math.max(64,Math.round(h*k));
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const g=cv.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,cw,ch);g.drawImage(img,0,0,cw,ch);
      for(const q of [0.82,0.7,0.58]){
        const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
        if(blob&&blob.size<=280000)return blob;
      }
      k*=0.8;
    }
    return null;
  }finally{URL.revokeObjectURL(url)}
}
async function apiBin(method,path,blob,ctype){
  try{
    const h={'content-type':ctype||'image/jpeg'};
    if(S.initData)h['x-init-data']=S.initData;
    const r=await fetch(path,{method,headers:h,body:blob,cache:'no-store'});
    let data=null;try{data=await r.json()}catch(e){}
    return {ok:r.ok,status:r.status,data};
  }catch(e){return {ok:false,status:0,data:null}}
}
async function uploadPhoto(id,file){
  if(!S.auth||!S.admin||S.upl[id])return;
  const p=S.prod.items.find(x=>x.id===id);if(!p)return;
  S.upl[id]=true;paintPhoto(id);
  let ok=false;
  try{
    await flushSave();   // товар должен уже быть на сервере, иначе фото некуда привязать
    const blob=await shrinkPhoto(file);
    if(blob){
      const r=await apiBin('PUT','/api/admin/photo/'+encodeURIComponent(id),blob);
      if(r.ok&&r.data){p.pv=r.data.pv||'';ok=true}
    }
  }catch(e){}
  delete S.upl[id];paintPhoto(id);
  toast(ok?L('Фото сохранено','Rasm saqlandi'):L('Не удалось загрузить фото. Попробуйте другое изображение.','Rasmni yuklab boʻlmadi. Boshqa rasm tanlang.'));
}
async function removePhoto(id){
  const p=S.prod.items.find(x=>x.id===id);if(!p||S.upl[id])return;
  S.upl[id]=true;paintPhoto(id);
  const r=await api('DELETE','/api/admin/photo/'+encodeURIComponent(id));
  if(r.ok)p.pv='';
  delete S.upl[id];paintPhoto(id);
  if(!r.ok)toast(L('Не удалось убрать фото','Rasmni olib tashlab boʻlmadi'));
}

function paintSave(){
  const el=$('#savebar');if(!el)return;
  const t={
    saving:L('Сохраняем…','Saqlanmoqda…'),
    saved:L('Сохранено, клиенты видят изменения','Saqlandi, mijozlar oʻzgarishlarni koʻradi'),
    error:L('Не удалось сохранить. Проверьте соединение и измените что-нибудь ещё раз.','Saqlab boʻlmadi. Ulanishni tekshiring va yana biror narsani oʻzgartiring.'),
    nodb:L('Изменения не сохраняются: нет доступа к хранилищу.','Oʻzgarishlar saqlanmaydi: ombor mavjud emas.')
  }[S.saveState]||'';
  el.textContent=t;el.className='savebar'+(S.saveState==='error'||S.saveState==='nodb'?' bad':'');
}
function queueSave(kind){
  if(kind==='prod')S.dirtyP=true;else S.dirtyC=true;
  S.dirty=true;
  if(!S.auth||!S.admin){S.saveState='nodb';paintSave();return}
  S.saveState='saving';paintSave();
  clearTimeout(saveT);saveT=setTimeout(doSave,700);
}
async function doSave(){
  if(S.saving){S.again=true;return}
  S.saving=true;
  do{
    S.again=false;
    const jobs=[];
    if(S.dirtyC){S.dirtyC=false;jobs.push(api('PUT','/api/admin/config',{cfg:clone(S.cfg)}).then(r=>{if(!r.ok)S.dirtyC=true;return r.ok}))}
    if(S.dirtyP){S.dirtyP=false;jobs.push(api('PUT','/api/admin/products',{prod:clone(S.prod)}).then(r=>{if(!r.ok)S.dirtyP=true;return r.ok}))}
    const res=await Promise.all(jobs);
    S.saveState=res.every(Boolean)?'saved':'error';
  }while(S.again&&S.saveState!=='error');
  S.saving=false;
  S.dirty=S.dirtyC||S.dirtyP;
  paintSave();
}
/* Дожидается, пока все правки уйдут на сервер (нужно перед загрузкой фото). */
async function flushSave(){
  clearTimeout(saveT);
  while(S.saving)await waitMs(80);
  if(S.dirtyC||S.dirtyP)await doSave();
}
function applyOrder(o,stats){
  if(!o)return;
  const upd=list=>list.map(x=>x.id===o.id?Object.assign({},x,o):x);
  S.allOrders=upd(S.allOrders);S.myOrders=upd(S.myOrders);
  if(stats)S.stats=stats;
  renderNav();
  if(S.view==='seller'&&S.sellerTab==='orders')paintSeller();
  else if(S.view==='mine')renderMine();
}
async function setStatus(id,to){
  const r=await api('POST','/api/admin/status',{id,to});
  if(!r.ok){
    toast(L('Не удалось обновить статус','Holatni yangilab boʻlmadi'));
    if(r.data&&r.data.order)applyOrder(r.data.order,r.data.stats);
    return;
  }
  applyOrder(r.data.order,r.data.stats);
  loadStock();   // выдача списывает товар, отмена возвращает
}
/* «Повторить заказ»: кладёт в корзину всё из прошлого заказа, что сейчас есть в продаже (по сегодняшним ценам и остаткам). */
function repeatOrder(id){
  const o=S.myOrders.find(x=>x.id===id);
  if(!o)return;
  let added=0,cut=0;const skipped=[];
  (o.items||[]).forEach(it=>{
    const p=S.prod.items.find(x=>x.id===it.id),qty=Number(it.qty)||0;
    if(!p||soldOut(p)||qty<1){skipped.push(nm(it));return}
    const cur=S.cart[p.id]||0;
    if(!cur&&cartLines().length>=MAX_LINES){skipped.push(nm(it));return}
    const want=Math.min(MAX_QTY,cur+qty),cap=maxQty(p),got=Math.min(want,cap);
    if(got<want)cut++;
    if(got>cur){S.cart[p.id]=got;added++}
  });
  saveCart();
  if(!added){toast(L('Этих товаров сейчас нет в наличии','Bu mahsulotlar hozir mavjud emas'));return}
  S.shopPlaced=null;S.shopStep='cart';
  go('shop');
  toast(L('Товары из заказа '+id+' добавлены в корзину. Проверьте количество и цены.','Buyurtma '+id+' mahsulotlari savatga qoʻshildi. Miqdor va narxlarni tekshiring.')
    +(skipped.length?L(' Нет в наличии: ',' Mavjud emas: ')+skipped.slice(0,3).join(', ')+(skipped.length>3?'…':'')+'.':'')
    +(cut?L(' Количество уменьшено по остатку.',' Miqdor qoldiqqa qarab kamaytirildi.'):''));
}
async function cancelMine(id){
  const r=await api('POST','/api/cancel',{id});
  if(!r.ok){
    toast(L('Не удалось отменить: продавец уже принял заказ. Напишите ему.','Bekor qilib boʻlmadi: sotuvchi buyurtmani qabul qilgan. Unga yozing.'));
    if(r.data&&r.data.order)applyOrder(r.data.order);
    return;
  }
  applyOrder(r.data.order);
}
