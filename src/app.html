<style>
/* Layout: catalog with search and categories, cart with order form; seller panel is a tabbed list of orders, catalog editor and settings. */
:root{
  --bg:#FFFFFF; --surface:#F8F7F5; --surface-2:#EFEEEC; --ink:#1A1A1E; --ink-2:#666672; --line:#E6E6E6;
  --accent:#139A78; --accent-ink:#FFFFFF; --accent-soft:#DDF3EC; --tx:#08755A; --grp:#B4541A;
  --hot:#FC502C; --hot-ink:#FFFFFF; --gbg:#FFFFFF;
  --stage-a:#EAF6F1; --stage-b:#F1F0EE;
  --bc-bg:#E3F5EE; --bc-edge:#BDE3D5; --bc-bar:#139A78; --bc-in:#FFFFFF; --oedge:#DAD8D2; --bar-mute:#C9C8C4;
  --ok:#1F7A4D; --ok-soft:#DDF3E6; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#D63A1F; --bad-soft:#FFE4DC; --info:#1F5FA3; --info-soft:#DCEBFA; --mute:#666672; --mute-soft:#EFEEEC;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hdr:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#1A201D; --surface-2:#242C28; --ink:#F1F5F3; --ink-2:#9FACA6; --line:#2D3833;
    --accent:#34D1A4; --accent-ink:#04201A; --accent-soft:#18382F; --tx:#5BE0BA; --grp:#E8A662;
    --hot:#FF7A5C; --hot-ink:#2A0A03; --gbg:#2C3631;
    --stage-a:#1E2B26; --stage-b:#232826;
    --bc-bg:#16332B; --bc-edge:#2A6A56; --bc-bar:#34D1A4; --bc-in:#141B18; --oedge:#2D3833; --bar-mute:#4A524E;
    --ok:#6FD3A0; --ok-soft:#1D3A2D; --warn:#F2B957; --warn-soft:#3F3015; --bad:#FF8A75; --bad-soft:#44201E; --info:#7DB6F0; --info-soft:#1B3149; --mute:#9FACA6; --mute-soft:#242C28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#1A201D; --surface-2:#242C28; --ink:#F1F5F3; --ink-2:#9FACA6; --line:#2D3833;
  --accent:#34D1A4; --accent-ink:#04201A; --accent-soft:#18382F; --tx:#5BE0BA; --grp:#E8A662;
  --hot:#FF7A5C; --hot-ink:#2A0A03; --gbg:#2C3631;
  --stage-a:#1E2B26; --stage-b:#232826;
  --bc-bg:#16332B; --bc-edge:#2A6A56; --bc-bar:#34D1A4; --bc-in:#141B18; --oedge:#2D3833; --bar-mute:#4A524E;
  --ok:#6FD3A0; --ok-soft:#1D3A2D; --warn:#F2B957; --warn-soft:#3F3015; --bad:#FF8A75; --bad-soft:#44201E; --info:#7DB6F0; --info-soft:#1B3149; --mute:#9FACA6; --mute-soft:#242C28;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-text-size-adjust:100%;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px/1 var(--f-display);letter-spacing:.01em;min-width:0}
.brand svg{flex:none}

.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{flex:1}
.langsw{flex:none;display:inline-flex;gap:2px;padding:3px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface)}
.langsw button{appearance:none;border:0;background:transparent;color:var(--ink-2);min-width:36px;height:30px;padding:0 6px;border-radius:8px;font-weight:700;font-size:12px;letter-spacing:.04em;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mhd .langsw{display:none}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hot);color:var(--hot-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.top .wrap{justify-content:flex-start;gap:12px}
.menubtn{position:relative;flex:none;appearance:none;width:42px;height:42px;padding:0;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.menubtn .badge[hidden]{display:none}
.menubtn .badge{position:absolute;top:-8px;right:-8px;box-sizing:content-box;border:2px solid var(--bg);height:16px;min-width:16px;padding:0 3px;font-size:10px}

/* меню: выдвигается слева; на широком экране стоит слева всегда */
.mscrim{position:fixed;inset:0;z-index:60;background:rgba(10,20,18,.5)}
.menu{position:fixed;top:0;bottom:0;left:0;z-index:61;width:min(86vw,300px);display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);transform:translateX(-104%);visibility:hidden;box-shadow:0 0 28px rgba(10,20,18,.28)}
html.mn-open .menu{transform:none;visibility:visible}
html.mn-open,html.mn-open body{overflow:hidden}
@media (prefers-reduced-motion:no-preference){.menu{transition:transform .2s ease,visibility 0s linear .2s}html.mn-open .menu{transition:transform .2s ease,visibility 0s}}
.mhd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--hdr);padding:6px 10px 6px 16px;border-bottom:1px solid var(--line)}
.mhd .brand{flex:1}
.mrole{flex:none;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.mrole b{color:var(--ink);font-weight:600}
.mclose{flex:none;appearance:none;width:40px;height:40px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mnav{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 14px;overscroll-behavior:contain}
.mgh{padding:18px 10px 5px;font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--grp)}
.mnav>.mgh:first-child{padding-top:12px}
.mi{appearance:none;width:100%;min-height:44px;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:15px;font-weight:600;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
.mi .ml{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi[aria-current="page"]{background:var(--accent-soft)}

/* фото товара: до трёх; версии лежат в pv (главное, видно в каталоге), pv2, pv3; подряд, без пропусков */
const PH_MAX=3;
const phVers=p=>{const v=[p.pv,p.pv2,p.pv3].map(x=>typeof x==='string'?x:'');const n=v.findIndex(x=>!x);return n<0?v:v.slice(0,n)};
const imgUrl=(p,n,did)=>'/img/'+encodeURIComponent(did||S.did||'main')+'/'+encodeURIComponent(p.id)+'?v='+encodeURIComponent((n>1?p['pv'+n]:p.pv)||'')+(n>1?'&n='+n:'');

/* Корзина одна на всё приложение и принадлежит одному дистрибьютору: {did, name, items}. Прежний формат (просто {товар: штуки}) — это первый дистрибьютор. */
function loadCart(){
  S.cart={};S.otherCart=null;
  try{
    const c=JSON.parse(localStorage.getItem('sh-cart')||'{}');
    if(!c||typeof c!=='object'||Array.isArray(c))return;
    const nw=typeof c.did==='string'&&c.items&&typeof c.items==='object'&&!Array.isArray(c.items);
    const did=nw?c.did:'main',items=nw?c.items:c;
    if(!Object.keys(items).length)return;
    if(did===S.did)S.cart=items;
    else S.otherCart={did,name:nw&&typeof c.name==='string'?c.name:'',items};
  }catch(e){}
}
function saveCart(){
  if(S.otherCart)return;   // пока открыт другой дистрибьютор, его корзину не трогаем
  try{
    if(Object.keys(S.cart).length)localStorage.setItem('sh-cart',JSON.stringify({did:S.did,name:S.cfg.shop.name||'',items:S.cart}));
    else localStorage.removeItem('sh-cart');
  }catch(e){}
}
const otherCartName=()=>S.otherCart?(S.otherCart.name||shopNameOf(S.otherCart.did)):'';
const otherCartCount=()=>S.otherCart?Object.keys(S.otherCart.items).length:0;
/* Товар добавляют у одного дистрибьютора, а в корзине уже товары другого: спрашиваем, очистить ли её. */
function askOtherCart(cb){
  if(!S.otherCart){cb();return}
  const n=otherCartName(),q=n?' («'+n+'»)':'';
  askConfirm(L('В корзине товары другого дистрибьютора'+q+'. Очистить корзину и добавить этот товар?','Savatda boshqa distribyutor'+q+' mahsulotlari bor. Savatni tozalab, bu mahsulotni qoʻshamizmi?'),()=>{
    S.otherCart=null;
    try{localStorage.removeItem('sh-cart')}catch(e){}
    cb();
  });
}
/* имя, телефон, способ и адрес запоминаем на телефоне, чтобы повторный заказ был быстрее */
function loadForm(){
  try{
    const f=JSON.parse(localStorage.getItem('sh-form')||'{}');
    if(f&&typeof f==='object'){
      ['name','phone','address'].forEach(k=>{if(typeof f[k]==='string')S.form[k]=f[k].slice(0,200)});
      if(f.mode==='delivery')S.form.mode='delivery';
      if(typeof f.terr==='string')S.form.terr=f.terr.slice(0,12);
    }
  }catch(e){}
}
function saveForm(){try{localStorage.setItem('sh-form',JSON.stringify({name:S.form.name,phone:S.form.phone,address:S.form.address,mode:S.form.mode,terr:S.form.terr}))}catch(e){}}
/* профиль на сервере главнее того, что запомнил телефон: имя и телефон берём из него; адрес подставляем, если поле пустое */
function applyProfile(){
  const p=S.profile,c=S.hub.me&&S.hub.me.card;
  if(!p&&!c)return;
  if(p){
    if(p.name)S.form.name=p.name;
    if(p.phone)S.form.phone=p.phone;
    if(!S.form.address&&p.addrs&&p.addrs.length)S.form.address=p.addrs[0];
  }
  /* Данные из общей базы магазинов: пустые поля заполняются сами (на любом телефоне и у любого дистрибьютора), поэтому повторно вводить их не нужно.
     Если агент исправил название или телефон (ver вырос), исправление применяется один раз. */
  if(c){
    let seen=0;try{seen=Number(localStorage.getItem('sh-cardv'))||0}catch(e){}
    const fix=c.ver>seen;
    if(c.name&&(fix||!S.form.name))S.form.name=c.name;
    if(c.phone&&(fix||!S.form.phone))S.form.phone=c.phone;
    if(c.addr&&!S.form.address)S.form.address=c.addr;
    if(c.terr)S.form.terr=c.terr;
    if(fix)try{localStorage.setItem('sh-cardv',String(c.ver))}catch(e){}
  }
  saveForm();
}
const blockedTxt=()=>L('Оформление заказов для вас сейчас недоступно. Свяжитесь с продавцом','Hozir siz uchun buyurtma berish mavjud emas. Sotuvchi bilan bogʻlaning')+(S.cfg.shop.phone?': '+S.cfg.shop.phone:'.');
/* Товар нельзя заказать: продавец снял галочку «В наличии» или свободный остаток равен нулю. Поле av приходит с сервера у товаров с учётом (сколько можно заказать, не больше 500), lw — товара мало. */
/* Проверка товаров: без метки ms товар одобрен; wait — ждёт проверки (клиент видит серым, без цены); draft и ret видит только продавец. */
const apr=p=>!p.ms;
const isPend=p=>p.ms==='wait';
const soldOut=p=>p.on===false||p.av===0||!!p.ms;
/* Сколько штук можно положить в корзину: до 500, а у товаров с учётом — не больше свободного остатка. */
const maxQty=p=>typeof p.av==='number'?Math.min(MAX_QTY,p.av):MAX_QTY;
const capOf=id=>{const p=S.prod.items.find(x=>x.id===id);return p?maxQty(p):MAX_QTY};
/* Убирает из корзины то, чего больше нет в каталоге или что закончилось, и уменьшает количество до остатка. Возвращает, сколько позиций изменено. */
function pruneCart(){
  let n=0;
  Object.keys(S.cart).forEach(id=>{
    const p=S.prod.items.find(x=>x.id===id),q=Number(S.cart[id]);
    if(!p||soldOut(p)||!(q>=1)){delete S.cart[id];n++}
    else{const m=Math.min(maxQty(p),Math.floor(q));if(m!==q)n++;S.cart[id]=m}
  });
  if(n)saveCart();
  return n;
}
const cartLines=()=>S.prod.items.filter(p=>S.cart[p.id]>0).map(p=>({p,qty:S.cart[p.id]}));
const cartCount=()=>cartLines().reduce((s,l)=>s+l.qty,0);
/* цена за штуку зависит от количества (ступени), скидка от суммы, доставка: всё считается так же, как на сервере (общие функции unitPrice, orderDiscount, deliveryFee) */
const cartTotal=()=>cartLines().reduce((s,l)=>s+l.qty*unitPrice(l.p,l.qty),0);
const cartDisc=()=>orderDiscount(S.cfg,cartTotal());
const cartFee=()=>deliveryFee(S.cfg,mode(),cartTotal());
const cartPay=()=>cartTotal()-cartDisc().amount+cartFee();
const minOrder=()=>Number(S.cfg.shop.minOrder)||0;
/* Ставит количество в корзине (не больше остатка и 500). Возвращает, сколько в итоге стоит в корзине. */
function cartSet(id,q){
  const p=S.prod.items.find(x=>x.id===id),cap=p?maxQty(p):MAX_QTY;
  q=Math.max(0,Math.floor(q)||0);
  if(q>cap){
    q=cap;
    if(p&&typeof p.av==='number'&&p.av<MAX_QTY)toast(p.av>0?L('Осталось только '+p.av,'Faqat '+p.av+' ta qoldi'):L('Товар закончился','Mahsulot tugadi'));
  }
  if(q)S.cart[id]=q;else delete S.cart[id];
  saveCart();
  return q;
}

/* Роли человека берутся с площадки (S.hub.me): владелец, агент, продавец и доставщик у каких-то дистрибьюторов. Кроме этого он всегда магазин-клиент. */
function myRoles(){
  const me=S.auth&&S.hub&&S.hub.me;
  if(!me)return [];
  const r=[];
  if(me.owner)r.push({k:'owner',n:L('Владелец площадки','Platforma egasi'),d:[]});
  if(me.agent)r.push({k:'agent',n:L('Агент','Agent'),d:me.agent.name?[me.agent.name]:[]});
  if((me.sells||[]).length)r.push({k:'seller',n:L('Продавец','Sotuvchi'),d:me.sells.map(x=>x.name)});
  if((me.delivers||[]).length)r.push({k:'courier',n:L('Доставщик','Yetkazuvchi'),d:me.delivers.map(x=>x.name)});
  return r;
}
/* Строка в меню: роли, с которыми человек работает сейчас; у продавца и доставщика ещё название открытого дистрибьютора. */
function roleLine(){
  const me=S.auth&&S.hub&&S.hub.me;
  if(!me)return '';
  const here=S.did,sells=me.sells||[],dels=me.delivers||[],parts=[];
  const sl=here?sells.find(x=>x.id===here):sells[0],dl=here?dels.find(x=>x.id===here):dels[0];
  if(me.owner)parts.push(L('Владелец','Egasi'));
  if(me.agent)parts.push(L('Агент','Agent'));
  if(sl)parts.push(L('Продавец','Sotuvchi'));
  if(dl)parts.push(L('Доставщик','Yetkazuvchi'));
  if(here&&(sl||dl))parts.push((sl||dl).name);
  return parts.length?parts.join(' · '):L('Магазин','Doʻkon');
}

  root.classList.toggle('mn-open',on);
  $('#mscrim').hidden=!on;
  $('#menubtn').setAttribute('aria-expanded',String(on));
  if(on){
    menuBack=document.activeElement;
    const f=$('#nav [aria-current="page"]')||$('#nav .mi');
    if(f){f.focus({preventScroll:true});try{f.scrollIntoView({block:'nearest'})}catch(e){}}
  }else{
    const inside=document.activeElement&&$('#menu').contains(document.activeElement);
    if(inside||!document.activeElement||document.activeElement===document.body){const b=menuBack&&document.contains(menuBack)&&!$('#menu').contains(menuBack)?menuBack:$('#menubtn');try{b.focus({preventScroll:true})}catch(e){}}
    menuBack=null;
  }
}
document.addEventListener('keydown',e=>{
  if(!menuIsOpen())return;
  if(e.key==='Escape'){e.preventDefault();menuSet(false);return}
  if(e.key!=='Tab')return;
  const list=[...$('#menu').querySelectorAll('button')].filter(x=>!x.closest('[hidden]')&&!x.disabled&&x.offsetParent!==null);
  if(!list.length)return;
  const first=list[0],last=list[list.length-1];
  if(!$('#menu').contains(document.activeElement)){e.preventDefault();first.focus();return}
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

/* Поиск по названию, описанию и весу на обоих языках: каждое слово запроса должно встретиться. */
const normQ=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[ʻʼ’‘`']/g,'');
function matchQ(p,q){
  const words=normQ(q).split(/\s+/).filter(Boolean);
  if(!words.length)return true;
  const hay=normQ([p.name,p.uz,p.desc,p.descUz,weightLabel(p)].join(' '));
  return words.every(w=>hay.indexOf(w)>=0);
}

  if(S.prod.items.some(p=>p.tag==='new'&&apr(p)))out.push(['new',tagName('new')]);

}

    expired:L('Сессия устарела. Закройте и снова откройте приложение в боте.','Seans eskirdi. Ilovani yopib, botdan qayta oching.'),

async function submitOrder(){
  if(S.busy)return;
  const lines=cartLines();
  if(!lines.length){S.shopStep='list';renderShop();return}
  const e=validate();
  FIELDS.forEach(k=>{
    const el=$('#e-'+k),inp=$('#f-'+k);
    if(el)el.textContent=e[k]||'';
    if(inp)inp.setAttribute('aria-invalid',e[k]?'true':'false');
  });
  const first=FIELDS.find(k=>e[k]);
  if(first){const inp=$('#f-'+first);if(inp){inp.focus();try{inp.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}}return}
  if(!S.auth){toast(L('Откройте приложение через бота в Telegram, чтобы оформить заказ','Buyurtma berish uchun ilovani Telegramdagi bot orqali oching'));return}
  if(S.blocked){toast(blockedTxt());return}
  if(S.off){toast(offTxt());return}
  if(minOrder()>0&&cartTotal()<minOrder()){
    toast(L('Минимальная сумма заказа: '+money(minOrder()),'Buyurtmaning minimal summasi: '+money(minOrder())));
    const m=$('#cmin');if(m)try{m.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}
    return;
  }
  S.busy=true;
  const btn=$('#submit');if(btn){btn.disabled=true;btn.textContent=L('Отправляем…','Yuborilmoqda…')}
  const f=S.form,del=mode()==='delivery';
  const r=await api('POST','/api/order',{
    cart:lines.map(l=>({id:l.p.id,qty:l.qty})),
    form:{name:f.name.trim(),phone:f.phone.trim(),mode:mode(),address:del?f.address.trim():'',region:del?orderRegion():'',terr:terrKnown()?S.hub.me.card.terr:(terrCur()==='-'?'':terrCur()),date:f.date,time:f.time,comment:f.comment.trim(),loc:f.loc||undefined},
    lang:LANG,expectTotal:cartPay()
  });
  S.busy=false;
  if(!r.ok){
    const er=r.data&&r.data.error;
    if(r.data&&r.data.cfg){S.cfg=mergeCfg(r.data.cfg);normalizeMode()}
    if(r.data&&r.data.prod)S.prod=normProd(r.data.prod);
    if(er==='stock'){
      /* товара меньше, чем в корзине: показываем, сколько осталось, и уменьшаем корзину */
      const short=Array.isArray(r.data.short)?r.data.short:[];
      const what=short.slice(0,3).map(s=>{
        const p=S.prod.items.find(x=>x.id===s.id),n=Number(s.avail)||0;
        return (p?nm(p):'')+': '+(n>0?L('осталось '+n,'faqat '+n+' ta qoldi'):L('нет в наличии','mavjud emas'));
      }).join('; ')+(short.length>3?'…':'');
      short.forEach(s=>{
        const n=Number(s.avail)||0;
        if(n<=0)delete S.cart[s.id];else if((S.cart[s.id]||0)>n)S.cart[s.id]=n;
      });
      saveCart();pruneCart();
      S.shopStep=cartCount()?'cart':'list';
      renderNav();renderShop();
      toast(L('Столько товара нет на складе. '+what+'. Мы обновили корзину.','Omborda buncha mahsulot yoʻq. '+what+'. Savatni yangiladik.'));
      return;
    }
    if(er==='min_order'){
      renderShop();
      toast(L('Минимальная сумма заказа: '+money(Number(r.data.min)||minOrder()),'Buyurtmaning minimal summasi: '+money(Number(r.data.min)||minOrder())));
      return;
    }
    if(er==='no_region'||er==='region_need'){
      normalizeRegion();renderShop();
      toast(er==='region_need'?L('Выберите регион доставки.','Yetkazib berish hududini tanlang.')
        :L('Дистрибьютор не доставляет в этот регион. Выберите самовывоз или регион из списка.','Distribyutor bu hududga yetkazib bermaydi. Olib ketishni yoki roʻyxatdagi hududni tanlang.'));
      return;
    }
    if(er==='price_changed'||er==='unavailable'||er==='no_delivery'){
      pruneCart();
      S.shopStep=cartCount()?'cart':'list';
      renderNav();renderShop();
      toast(er==='price_changed'?L('Продавец обновил цены. Проверьте сумму и оформите заказ ещё раз.','Sotuvchi narxlarni yangiladi. Summani tekshirib, qaytadan buyurtma bering.')
        :er==='no_delivery'?L('Доставка сейчас недоступна. Выберите самовывоз.','Hozir yetkazib berish mavjud emas. Olib ketishni tanlang.')
        :L('Что-то из корзины закончилось, мы обновили её. Проверьте заказ и оформите ещё раз.','Savatdagi baʼzi narsalar tugadi, savatni yangiladik. Buyurtmani tekshirib, qaytadan bering.'));
      return;
    }
    if(er==='blocked')S.blocked=true;
    if(er==='shop_off')S.off=true;
    renderShop();toast(orderErrText(er));
    return;
  }
  const order=r.data.order;
  order.did=S.did;order.shopName=S.cfg.shop.name||'';
  S.cart={};saveCart();
  S.shopPlaced={order};S.shopStep='list';
  loadHub();   // магазин уже в общей базе: поле района больше не нужно
  S.myOrders=[order].concat(S.myOrders.filter(o=>!(o.id===order.id&&(o.did||S.did)===S.did)));
  S.form.comment='';S.form.loc=null;   // точка относится к одному заказу: в следующий раз магазин может быть уже в другом месте
  if(!S.profile)S.profile={name:order.name,phone:order.phone,org:'',addrs:order.mode==='delivery'&&order.address?[order.address]:[]};
  else{
    if(!S.profile.name)S.profile.name=order.name;
    if(!S.profile.phone)S.profile.phone=order.phone;
    if(order.mode==='delivery'&&order.address&&S.profile.addrs.length<5&&!S.profile.addrs.some(a=>a.toLowerCase()===order.address.toLowerCase()))S.profile.addrs=S.profile.addrs.concat([order.address]);
  }
  try{S.tg&&S.tg.HapticFeedback&&S.tg.HapticFeedback.notificationOccurred('success')}catch(x){}
  renderNav();renderShop();
  window.scrollTo(0,0);
}

/* общая проверка полей клиента на телефоне; возвращает {v} или {e:{поле:текст}} */
function checkClientFields(get){
  const e={},v={name:get('name').trim(),phone:get('phone').trim(),org:get('org').trim()};
  if(v.phone&&(v.phone.replace(/\D/g,'').length<9||v.phone.replace(/\D/g,'').length>15))e.phone=L('Проверьте номер телефона','Telefon raqamini tekshiring');
  const lines=get('addrs').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),addrs=[];
  lines.forEach(x=>{if(!addrs.some(y=>y.toLowerCase()===x.toLowerCase()))addrs.push(x)});
  if(addrs.some(x=>x.length<5))e.addrs=L('Адрес слишком короткий','Manzil juda qisqa');
  else if(addrs.length>5)e.addrs=L('Можно сохранить не больше 5 адресов','5 tadan ortiq manzil saqlab boʻlmaydi');
  v.addrs=addrs;
  return Object.keys(e).length?{e}:{v};
}
const clientErrText=er=>({
  bad_phone:L('Проверьте номер телефона','Telefon raqamini tekshiring'),
  bad_addr:L('Адрес слишком короткий','Manzil juda qisqa'),
  too_many_addrs:L('Можно сохранить не больше 5 адресов','5 tadan ortiq manzil saqlab boʻlmaydi'),
  busy:L('Сейчас сохранить нельзя. Попробуйте позже.','Hozir saqlab boʻlmaydi. Keyinroq urinib koʻring.')
}[er]||L('Не удалось сохранить. Проверьте соединение.','Saqlab boʻlmadi. Ulanishni tekshiring.'));
async function saveProfile(){
  if(S.pfBusy||!S.auth)return;
  const get=k=>{const el=document.getElementById('p-'+k);return el?String(el.value):''};
  const c=checkClientFields(get);
  ['name','phone','org','addrs'].forEach(k=>{const er=document.getElementById('pe-'+k),inp=document.getElementById('p-'+k);if(er)er.textContent=(c.e&&c.e[k])||'';if(inp)inp.setAttribute('aria-invalid',c.e&&c.e[k]?'true':'false')});
  if(c.e){const k=Object.keys(c.e)[0],inp=document.getElementById('p-'+k);if(inp)inp.focus();return}
  S.pfBusy=true;
  const btn=$('#pfsave');if(btn)btn.disabled=true;
  const r=await api('PUT','/api/profile',c.v);
  S.pfBusy=false;
  if(btn)btn.disabled=false;
  if(!r.ok||!r.data||!r.data.profile){toast(clientErrText(r.data&&r.data.error));return}
  S.profile=r.data.profile;
  /* данные профиля подставляем в форму заказа сразу; адрес — только если поле пустое или адреса больше нет в профиле */
  S.form.name=S.profile.name||S.form.name;S.form.phone=S.profile.phone||S.form.phone;
  if(!S.form.address||!S.profile.addrs.some(a=>a.toLowerCase()===S.form.address.toLowerCase()))S.form.address=S.profile.addrs[0]||S.form.address;
  saveForm();
  toast(L('Профиль сохранён','Profil saqlandi'));
  if(S.view==='profile')renderProfile();
}

  else if(r.cf==='ok')h=c('ok','✓ '+L('Вы подтвердили','Siz tasdiqladingiz'));

/* Записи, на которые магазин ещё не ответил или ответил «Не так» (их можно изменить на «Верно»). Записи одного заказа — одним блоком. */
function mdAsks(x){
  const rows=x.rows||[],seen=new Set(),out=[];
  rows.forEach(r=>{
    if((r.k!=='ch'&&r.k!=='pay')||!r.cf||r.cf==='ok'||r.void||r.rsl)return;
    const g=r.g||r.n;
    if(seen.has(g))return;
    seen.add(g);
    out.push({g,rows:rows.filter(z=>(z.g||z.n)===g&&(z.k==='ch'||z.k==='pay')&&z.cf)});
  });
  return out;
}

    +(no?'<div class="note warnnote">'+L('Вы отметили «Не так», продавец это видит. Если ошиблись, подтвердите запись.','Siz «Notoʻgʻri» dedingiz, sotuvchi buni koʻradi. Adashgan boʻlsangiz, yozuvni tasdiqlang.')+'</div>':'')

async function debtOpen(uid){
  const d=DB();
  Object.assign(d,{open:uid,det:null,ex:{},amount:'',pm:'cash',note:'',busy:false,vn:0,vwhy:'',rn:0,rnote:''});
  dPaint();window.scrollTo(0,0);
  const r=await api('GET',dApi()+'/'+uid);
  if(d.open!==uid)return;
  if(!r.ok||!r.data||!r.data.debt){d.open=null;dPaint();toast(L('Магазин не найден','Doʻkon topilmadi'));return}
  d.det=r.data.debt;d.amount=d.det.bal>0?String(d.det.bal):'';
  dPaint();
}
function debtClose(){DB().open=null;DB().det=null;dPaint();dLoad()}
function debtSync(){   // перед перерисовкой формы не теряем то, что уже введено
  const a=$('#dp-amount'),n=$('#dp-note'),w=$('#dx-why'),rn=$('#dx-note');
  if(a)DB().amount=a.value;
  if(n)DB().note=n.value;
  if(w)DB().vwhy=w.value;
  if(rn)DB().rnote=rn.value;
}
async function debtPay(){
  const d=DB(),x=d.det;
  if(!x||d.busy)return;
  debtSync();
  const raw=String(d.amount).trim(),amount=Number(raw);
  if(raw===''||!Number.isInteger(amount)||amount<1){toast(L('Введите сумму целым числом','Summani butun son bilan kiriting'));const el=$('#dp-amount');if(el)el.focus();return}
  const go=async()=>{
    d.busy=true;dPaint();
    const r=await api('POST',dApi()+'/'+x.uid+'/pay',{amount,m:d.pm,note:d.note.trim()});
    d.busy=false;
    if(!r.ok||!r.data||!r.data.debt){toast(crLimErr(r)||L('Не удалось записать оплату','Toʻlovni yozib boʻlmadi'));dPaint();if(crLimErr(r))loadCourier();return}
    d.det=r.data.debt;d.amount=d.det.bal>0?String(d.det.bal):'';d.note='';
    toast(L('Оплата записана','Toʻlov yozildi'));
    dPaint();dLoad();
  };
  if(amount>x.bal)askConfirm(x.bal>0
    ?L('Сумма больше долга ('+money(x.bal)+'). Разница запишется как аванс магазина. Продолжить?','Summa qarzdan ('+money(x.bal)+') katta. Farq doʻkon avansi sifatida yoziladi. Davom etasizmi?')
    :L('Долга нет. Записать оплату как аванс магазина?','Qarz yoʻq. Toʻlov doʻkon avansi sifatida yozilsinmi?'),go);
  else go();
}
/* «Отменить запись» и «Закрыть спор» открывают поле для причины или комментария прямо под записью. */
function debtVoid(n){
  const d=DB();
  if(!d.det||d.busy)return;
  debtSync();
  d.vn=d.vn===n?0:n;d.rn=0;d.vwhy='';
  dPaint();
  const el=$('#dx-why');if(el)el.focus();
}
function debtRes(n){
  const d=DB();
  if(!d.det||d.busy)return;
  debtSync();
  d.rn=d.rn===n?0:n;d.vn=0;d.rnote='';
  dPaint();
  const el=$('#dx-note');if(el)el.focus();
}
async function debtVoidGo(){
  const d=DB(),x=d.det;
  if(!x||d.busy||!d.vn)return;
  debtSync();
  const why=d.vwhy.trim();
  if(why.length<3){toast(L('Напишите причину (от 3 букв)','Sababni yozing (kamida 3 ta harf)'));const el=$('#dx-why');if(el)el.focus();return}
  d.busy=true;dPaint();
  const r=await api('POST',dApi()+'/'+x.uid+'/void',{n:d.vn,reason:why});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.debt){toast(L('Не удалось отменить запись','Yozuvni bekor qilib boʻlmadi'));dPaint();return}
  d.det=r.data.debt;d.amount=d.det.bal>0?String(d.det.bal):'';d.vn=0;d.vwhy='';
  toast(L('Запись отменена. Магазин получил причину.','Yozuv bekor qilindi. Doʻkon sababni oldi.'));
  dPaint();dLoad();
}
async function debtResGo(){
  const d=DB(),x=d.det;
  if(!x||d.busy||!d.rn)return;
  debtSync();
  const note=d.rnote.trim();
  if(note.length<3){toast(L('Напишите комментарий (от 3 букв)','Izoh yozing (kamida 3 ta harf)'));const el=$('#dx-note');if(el)el.focus();return}
  d.busy=true;dPaint();
  const r=await api('POST',dApi()+'/'+x.uid+'/resolve',{n:d.rn,note});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.debt){toast(r.status===409?L('Эта запись уже закрыта или ещё не спорная','Bu yozuv allaqachon yopilgan yoki hali bahsli emas'):L('Не удалось закрыть запись','Yozuvni yopib boʻlmadi'));dPaint();dLoad();return}
  d.det=r.data.debt;d.rn=0;d.rnote='';
  toast(L('Спор закрыт. Магазин получил комментарий.','Bahs yopildi. Doʻkon izohni oldi.'));
  dPaint();dLoad();
}
async function debtRemind(){
  const d=DB(),x=d.det;
  if(!x||d.busy)return;
  d.busy=true;debtSync();dPaint();
  const r=await api('POST',dApi()+'/'+x.uid+'/remind',{});
  d.busy=false;dPaint();
  toast(r.ok?L('Напоминание отправлено в Telegram','Eslatma Telegramga yuborildi')
    :r.status===429?L('Недавно уже напоминали. Повторить можно через час.','Yaqinda eslatilgan. Bir soatdan keyin takrorlash mumkin.')
    :r.status===502?L('Не получилось отправить: возможно, магазин остановил бота.','Yuborib boʻlmadi: doʻkon botni toʻxtatgan boʻlishi mumkin.')
    :L('Не удалось отправить напоминание','Eslatmani yuborib boʻlmadi'));
}

async function loadCourier(){
  if(!S.courier||!S.did)return;
  const r=await api('GET','/api/courier/orders');
  if(r.status===403){S.courier=null;renderNav();if(S.view==='courier')go('shop');return}   // доступ закрыт продавцом
  if(!r.ok||!r.data||!Array.isArray(r.data.orders))return;
  const c=S.cr,same=c.ok&&JSON.stringify([r.data.orders,r.data.soon,r.data.cash,r.data.lim,r.data.nvn,r.data.late,r.data.dl,r.data.ask])===JSON.stringify([c.orders,c.soon,c.cash,c.lim,c.nvn,c.late,c.dl,c.ask]);
  Object.assign(c,{ok:true,orders:r.data.orders,soon:r.data.soon,cash:r.data.cash,lim:r.data.lim||0,nvn:r.data.nvn||0,late:r.data.late||0,dl:r.data.dl||0,ask:r.data.ask||0});
  if(S.view==='courier'){loadCrDebts();if(c.tab==='cash')loadCrCash()}
  if(same||S.view!=='courier'){if(!same)renderNav();return}
  renderNav();
  const ae=document.activeElement;
  if(c.tab==='today'&&!(c.pay&&ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))){paintCrTabs();paintCourier()}
}
async function loadCrDebts(){
  if(!S.courier||!S.did)return;
  const r=await api('GET','/api/courier/debts');
  if(!r.ok||!r.data||!Array.isArray(r.data.debtors))return;
  const d=S.cr.dbt,same=d.ok&&JSON.stringify([r.data.debtors,r.data.total,r.data.late,r.data.fl])===JSON.stringify([d.list,d.total,d.late,d.fl]);
  Object.assign(d,{ok:true,list:r.data.debtors,total:r.data.total,overdue:r.data.overdue,n:r.data.n,late:r.data.late,fl:r.data.fl||0});
  if(same||S.view!=='courier')return;
  paintCrTabs();
  if(S.cr.tab==='debts'&&d.open===null){
    const ae=document.activeElement;
    if(!(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)))paintCourier();

}
async function loadCrCash(){
  if(!S.courier||!S.did)return;
  const r=await api('GET','/api/courier/cash');
  if(!r.ok||!r.data)return;
  crApplyCash(r.data);
  if(S.view==='courier'&&S.cr.tab==='cash')paintCourier();
}
function crApplyCash(d){
  Object.assign(S.cr,{cash:d.cash,lim:d.lim||0,dl:d.dl||0,late:d.late||0,cs:d.cs||'',ask:d.ask||0,rows:d.rows||[],nv:d.nv||[],nvn:(d.nv||[]).length,cashOk:true});
}
/* Доставщик отвечает на «Продавец записал сдачу»: «Верно» или «Не так». То же, что кнопки в Telegram. */
async function crHandAns(n,ok){
  if(S.cr.busy)return;
  S.cr.busy='h'+n;paintCourier();
  const r=await api('POST','/api/courier/confirm',{n,ok});
  S.cr.busy='';
  if(r.ok&&r.data&&Array.isArray(r.data.rows)){
    crApplyCash(r.data);
    toast(ok?L('Спасибо, подтверждено','Rahmat, tasdiqlandi'):L('Отмечено «Не так». Продавец увидит.','«Notoʻgʻri» deb belgilandi. Sotuvchi koʻradi.'));
  }else{
    const e=r.data&&r.data.error;
    toast(e==='final'?L('Вы уже подтвердили эту запись','Bu yozuvni allaqachon tasdiqlagansiz'):e==='resolved'?L('Продавец уже закрыл этот вопрос. Если не согласны, напишите ему.','Sotuvchi bu masalani yopgan. Rozi boʻlmasangiz, unga yozing.'):e==='void'?L('Эта запись уже отменена продавцом','Bu yozuv sotuvchi tomonidan bekor qilingan'):L('Не удалось отправить ответ. Проверьте соединение.','Javobni yuborib boʻlmadi. Ulanishni tekshiring.'));
  }
  paintCrTabs();paintCourier();loadCourier();loadCrCash();
}
async function crTake(id){
  if(S.cr.busy)return;
  S.cr.busy=id;paintCourier();
  const r=await api('POST','/api/courier/take',{id});
  S.cr.busy='';
  if(r.ok)toast(L('Заказ ваш. Клиент получил сообщение.','Buyurtma sizniki. Mijozga xabar yuborildi.'));
  else if(r.data&&r.data.error==='taken'){const n=r.data.order&&r.data.order.crn||'';toast(L('Заказ уже взял '+(n||'другой доставщик'),'Buyurtmani allaqachon '+(n||'boshqa yetkazuvchi')+' oldi'))}
  else toast(crLimErr(r)||L('Не удалось взять заказ','Buyurtmani olib boʻlmadi'));
  paintCourier();loadCourier();
}
function crRelease(id){
  askConfirm(L('Вернуть заказ? Его снова смогут взять другие доставщики.','Buyurtma qaytarilsinmi? Uni boshqa yetkazuvchilar olishi mumkin.'),async()=>{
    const r=await api('POST','/api/courier/release',{id});
    if(!r.ok)toast(L('Не удалось вернуть заказ','Buyurtmani qaytarib boʻlmadi'));
    S.cr.pay=null;loadCourier();
  });
}
async function crDone(id,pay){
  if(S.cr.busy)return;
  S.cr.busy=id;paintCourier();
  const r=await api('POST','/api/courier/done',{id,pay});
  S.cr.busy='';
  if(!r.ok||!r.data||!r.data.order){
    const er=r.data&&r.data.error;
    toast(er==='no_credit'?L('Выдавать в долг вам не разрешено. Позвоните продавцу.','Qarzga berishga ruxsat yoʻq. Sotuvchiga qoʻngʻiroq qiling.')
      :er==='not_yours'?L('Этот заказ не ваш','Bu buyurtma sizniki emas'):L('Не удалось записать выдачу. Проверьте соединение.','Topshirishni yozib boʻlmadi. Ulanishni tekshiring.'));
    paintCourier();loadCourier();return;
  }
  S.cr.pay=null;S.cr.cash=r.data.cash;
  toast(L('Выдача записана','Topshirish yozildi'));
  paintCrTabs();paintCourier();loadCourier();
}

async function dvAdd(){
  const d=S.dv;if(d.busy)return;
  const n=$('#dv-name'),p=$('#dv-phone');
  if(n)d.name=n.value;if(p)d.phone=p.value;
  if(d.name.trim().length<2){toast(dvErr('bad_name'));if(n)n.focus();return}
  d.busy=true;paintSeller();
  const r=await api('POST','/api/admin/couriers',{name:d.name.trim(),phone:d.phone.trim()});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.courier){toast(dvErr(r.data&&r.data.error));paintSeller();return}
  d.name='';d.phone='';
  toast(L('Готово. Отправьте доставщику ссылку.','Tayyor. Yetkazuvchiga havolani yuboring.'));
  await loadCouriers();paintSeller();
}
async function dvOpen(id,mode){
  const d=S.dv;
  if(d.open===id&&d.mode===mode){d.open=null;d.det=null;paintSeller();return}
  const c=d.list.find(x=>x.id===id);
  Object.assign(d,{open:id,mode,det:null,hv:0,hr:0,why:'',note:'',amount:mode==='hand'&&c?String(c.cash):mode==='lim'&&c&&c.lim?String(c.lim):''});
  paintSeller();
  const r=await api('GET','/api/admin/couriers/'+id);
  if(d.open!==id)return;
  if(r.ok&&r.data&&r.data.courier)d.det=r.data;
  paintSeller();
}
async function dvVerify(id,nv){
  const d=S.dv;if(d.busy)return;
  d.busy=true;paintSeller();
  const r=await api('POST','/api/admin/couriers/'+id+'/verify',{id:nv});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.courier){toast(r.status===404?L('Эта оплата уже сверена','Bu toʻlov allaqachon tekshirilgan'):dvErr(r.data&&r.data.error));await loadCouriers();paintSeller();return}
  d.det=r.data;
  toast(L('Отмечено: деньги пришли','Belgilandi: pul tushdi'));
  await loadCouriers();paintSeller();
}
async function dvSetDl(v){
  const d=S.dv,c=d.list.find(x=>x.id===d.open);
  if(!c||d.busy||!Number.isInteger(v))return;
  d.busy=true;paintSeller();
  const r=await api('PUT','/api/admin/couriers/'+c.id,{dl:v});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.courier){toast(dvErr(r.data&&r.data.error));paintSeller();return}
  d.open=null;d.det=null;
  toast(L('Срок сдачи: '+dlName(v),'Topshirish muddati: '+dlName(v)));
  await loadCouriers();paintSeller();
}
function dvHSync(){const w=$('#dh-why'),n=$('#dh-note');if(w)S.dv.why=w.value;if(n)S.dv.note=n.value}
function dvHVoid(n){
  const d=S.dv;if(d.busy)return;
  dvHSync();d.hv=d.hv===n?0:n;d.hr=0;d.why='';paintSeller();
  const el=$('#dh-why');if(el)el.focus();
}
function dvHRes(n){
  const d=S.dv;if(d.busy)return;
  dvHSync();d.hr=d.hr===n?0:n;d.hv=0;d.note='';paintSeller();
  const el=$('#dh-note');if(el)el.focus();
}
/* Отмена записи о сдаче и закрытие спора по сдаче: обе с обязательным текстом. */
async function dvHGo(kind){
  const d=S.dv,id=d.open,n=kind==='void'?d.hv:d.hr;
  if(!id||!n||d.busy)return;
  dvHSync();
  const txt=(kind==='void'?d.why:d.note).trim();
  if(txt.length<3){toast(dvErr(kind==='void'?'bad_reason':'bad_note'));const el=$(kind==='void'?'#dh-why':'#dh-note');if(el)el.focus();return}
  d.busy=true;paintSeller();
  const r=await api('POST','/api/admin/couriers/'+id+(kind==='void'?'/hvoid':'/hresolve'),kind==='void'?{n,reason:txt}:{n,note:txt});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.courier){toast(dvErr(r.data&&r.data.error));paintSeller();await loadCouriers();return}
  d.det=r.data;d.hv=0;d.hr=0;d.why='';d.note='';
  toast(kind==='void'?L('Сдача отменена. Доставщик получил причину.','Topshirish bekor qilindi. Yetkazuvchi sababni oldi.'):L('Спор закрыт. Доставщик получил комментарий.','Bahs yopildi. Yetkazuvchi izohni oldi.'));
  await loadCouriers();paintSeller();
}
async function dvSetLim(v){
  const d=S.dv,c=d.list.find(x=>x.id===d.open);
  if(!c||d.busy)return;
  const el=$('#dv-lim');
  const raw=v===undefined?String(el?el.value:d.amount).trim():String(v),lim=raw===''?0:Number(raw);
  if(!Number.isInteger(lim)||lim<0){toast(dvErr('bad_lim'));if(el)el.focus();return}
  d.busy=true;paintSeller();
  const r=await api('PUT','/api/admin/couriers/'+c.id,{lim});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.courier){toast(dvErr(r.data&&r.data.error));paintSeller();return}
  d.open=null;d.det=null;
  toast(lim>0?L('Лимит наличных: '+money(lim),'Naqd limiti: '+money(lim)):L('Лимит снят','Limit olib tashlandi'));
  await loadCouriers();paintSeller();
}
async function dvHand(){
  const d=S.dv,c=d.list.find(x=>x.id===d.open);
  if(!c||d.busy)return;
  const el=$('#dv-amount');if(el)d.amount=el.value;
  const raw=String(d.amount).trim(),amount=Number(raw);
  if(raw===''||!Number.isInteger(amount)||amount<1){toast(L('Введите сумму целым числом','Summani butun son bilan kiriting'));if(el)el.focus();return}
  if(amount>c.cash){toast(dvErr('bad_amount'));return}
  d.busy=true;paintSeller();
  const r=await api('POST','/api/admin/couriers/'+c.id+'/handover',{amount});
  d.busy=false;
  if(!r.ok||!r.data||!r.data.courier){toast(dvErr(r.data&&r.data.error));paintSeller();return}
  d.open=null;d.det=null;
  toast(L('Записано: сдано '+money(amount),'Yozildi: topshirildi '+money(amount)));
  await loadCouriers();paintSeller();
}
function dvLink(id){
  askConfirm(L('Выдать новую ссылку? Прежняя перестанет работать. Тот, кто войдёт по новой, станет этим доставщиком, а прежний аккаунт потеряет доступ.','Yangi havola berilsinmi? Eskisi ishlamay qoladi. Yangisi orqali kirgan odam shu yetkazuvchi boʻladi, oldingi akkaunt kirishni yoʻqotadi.'),async()=>{
    const r=await api('POST','/api/admin/couriers/'+id+'/link',{});
    if(!r.ok)toast(dvErr(r.data&&r.data.error));
    await loadCouriers();paintSeller();
  });

async function dvFlag(id,k){
  const c=S.dv.list.find(x=>x.id===id);if(!c)return;
  const r=await api('PUT','/api/admin/couriers/'+id,k==='credit'?{credit:!c.credit}:{on:!c.on});
  if(!r.ok)toast(dvErr(r.data&&r.data.error));

}
function dvDel(id){
  const c=S.dv.list.find(x=>x.id===id);if(!c)return;
  askConfirm(L('Удалить доставщика «'+c.name+'»? Заказы, которые он вёз, снова станут свободными.','«'+c.name+'» yetkazuvchisi oʻchirilsinmi? U olib ketayotgan buyurtmalar yana boʻsh boʻladi.'),async()=>{

/* сервер ведёт статусы сам: после сохранения берём их из ответа (названия, цены и фото на экране не трогаем) */
function mergeMod(prod){
  const before=S.prod.items.map(p=>p.id+':'+(p.ms||'')+':'+(p.mc||'')).join();
  const map=new Map(normProd(prod).items.map(i=>[i.id,i]));
  let grp=false;
  S.prod.items.forEach(p=>{
    const n=map.get(p.id);if(!n)return;
    const was=inModGroup(p);
    ['ms','mt','mc','ma'].forEach(k=>{if(n[k]===undefined)delete p[k];else p[k]=n[k]});
    if(was!==inModGroup(p))grp=true;
  });
  if(S.prod.items.map(p=>p.id+':'+(p.ms||'')+':'+(p.mc||'')).join()===before)return;
  paintTabs();renderNav();
  if(S.view!=='seller'||S.sellerTab!=='prod')return;
  if(grp)paintSeller();
  else paintModBits();
}
function paintModBits(){
  S.prod.items.forEach(p=>{const el=document.getElementById('mh-'+p.id);if(el)el.innerHTML=modHeadInner(p)});

}

async function modSubmit(ids){
  if(S.msubBusy)return;
  S.msubBusy=true;paintModBits();
  await flushSave();
  const r=await api('POST','/api/admin/submit',ids?{ids}:{});
  S.msubBusy=false;
  const bad=r.data&&Array.isArray(r.data.bad)?r.data.bad:[];
  if(r.data&&r.data.prod)mergeMod(r.data.prod);
  if(!r.ok){
    if(bad.length){
      const p=S.prod.items.find(x=>x.id===bad[0].id);
      toast((p?'«'+nm(p)+'»: ':'')+L('укажите '+bad[0].why.map(w=>MOD_WHY[w][0]).join(', '),bad[0].why.map(w=>MOD_WHY[w][1]).join(', ')+' koʻrsating'));

    paintSeller();return;
  }
  ids&&ids.forEach(id=>{delete S.medit[id]});
  S.prod.items.forEach(p=>{if(!inModGroup(p))delete S.medit[p.id]});
  paintSeller();
  const n=r.data.sent||0;
  toast(L('Отправлено на проверку: '+n+(bad.length?'. Не хватает данных у '+bad.length+'.':''),'Tekshiruvga yuborildi: '+n+(bad.length?'. '+bad.length+' tasida maʼlumot yetishmaydi.':'')));

async function importFile(file){
  if(S.impBusy||!S.admin)return;
  if(file.size>1000000){toast(impWhy('too_big'));return}
  S.impBusy=true;S.imp={busy:true};paintSeller();
  await flushSave();   // сначала уходят несохранённые правки каталога
  let bytes;
  try{bytes=new Uint8Array(await file.arrayBuffer())}catch(e){S.impBusy=false;S.imp=null;paintSeller();toast(impWhy(''));return}
  const r=await apiBin('POST','/api/admin/import',bytes,'application/octet-stream');
  S.impBusy=false;
  if(!r.ok||!r.data||!r.data.summary){S.imp=null;paintSeller();toast(r.data&&r.data.why?impWhy(r.data.why):L('Не удалось прочитать файл. Проверьте соединение.','Faylni oʻqib boʻlmadi. Ulanishni tekshiring.'));return}
  S.imp={bytes,res:r.data};paintSeller();
  try{document.getElementById('impsum').scrollIntoView({block:'center'})}catch(e){}
}
async function impApply(){
  if(S.impBusy||!S.imp||!S.imp.bytes)return;
  S.impBusy=true;paintSeller();
  await flushSave();
  const r=await apiBin('POST','/api/admin/import?apply=1',S.imp.bytes,'application/octet-stream');
  S.impBusy=false;
  if(!r.ok||!r.data||!r.data.summary){paintSeller();toast(L('Не удалось применить прайс. Проверьте соединение и попробуйте ещё раз.','Prays qoʻllanmadi. Ulanishni tekshirib, qayta urining.'));return}
  const sm=r.data.summary;
  if(r.data.prod){S.prod=normProd(r.data.prod);applyStk();pruneCart()}
  S.imp=null;paintSeller();renderNav();
  toast(L('Готово: добавлено '+sm.added+', изменено '+sm.updated+'.','Tayyor: '+sm.added+' ta qoʻshildi, '+sm.updated+' ta oʻzgardi.'));
}

/* ---------- seller: остатки ---------- */
/* состояние учёта товара: none (не ведётся), ok, low (мало), out (свободного нет) */
function stState(p){
  const s=S.stk[p.id];
  if(!s)return 'none';
  const a=stkAvail(s);
  return a===0?'out':(s.low>0&&a<=s.low?'low':'ok');
}
/* переносит остатки в каталог на экране, чтобы продавец видел витрину так же, как клиент */
function applyStk(){
  S.prod.items.forEach(p=>{
    const v=stkPublic(S.stk[p.id],MAX_QTY);
    delete p.av;delete p.lw;
    if(v){p.av=v.av;if(v.lw)p.lw=1}
  });
}
function statsHTML(){
  const c={none:0,ok:0,low:0,out:0};
  S.prod.items.forEach(p=>{c[stState(p)]++});
  const st=(lab,v,hot)=>'<div class="stat'+(hot?' hot':'')+'"><small>'+lab+'</small><b>'+v+'</b></div>';
  return st(L('Под учётом','Hisobda'),c.ok+c.low+c.out)+st(L('Без учёта','Hisobsiz'),c.none)+st(L('Заканчивается','Tugayapti'),c.low,c.low>0)+st(L('Нет свободного','Boʻshi yoʻq'),c.out,c.out>0);
}

function jrDate(t){
  const d=new Date(t);
  if(isNaN(d))return '';
  if(LANG==='uz')return d.getDate()+'-'+UZ_MO[d.getMonth()]+', '+pad(d.getHours())+':'+pad(d.getMinutes());
  return d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}

async function loadStock(){
  if(!S.admin)return;
  const r=await api('GET','/api/admin/stock');
  if(!r.ok||!r.data||!r.data.stk)return;
  const first=!S.stkLoaded;
  S.stkLoaded=true;
  if(!first&&JSON.stringify(r.data.stk)===JSON.stringify(S.stk))return;
  S.stk=r.data.stk;applyStk();
  if(S.view!=='seller')return;
  paintTabs();
  if(S.sellerTab==='stock'){
    const ae=document.activeElement,b=$('#sbody');
    if(ae&&b&&b.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;   // не мешаем, пока продавец вводит число
    paintStock();
  }
}

function stockNum(id,k,min){
  const el=document.getElementById(k+'-'+id),raw=el?String(el.value).trim():'';
  if(raw===''){toast(L('Введите количество','Miqdorni kiriting'));if(el)el.focus();return null}
  const n=Number(raw);
  if(!Number.isInteger(n)||n<min||n>1000000){
    toast(min>0?L('Введите целое число от 1','1 dan boshlab butun son kiriting'):L('Введите целое число, 0 или больше','Butun son kiriting (0 yoki koʻp)'));

  }

}

const RP_DAYS=[7,30,90,365];
const MO_S_RU=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],MO_S_UZ=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const MO_F_RU=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const dShort=d=>{const m=Number(d.slice(5,7))-1,n=Number(d.slice(8,10));return LANG==='uz'?n+'-'+UZ_MO[m]:n+' '+MO_S_RU[m]};
const fDay=d=>d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const mFull=m=>{const i=Number(m.slice(5,7))-1;return (LANG==='uz'?UZ_MO[i]:MO_F_RU[i])+' '+m.slice(0,4)};
const mShort=m=>{const i=Number(m.slice(5,7))-1;return LANG==='uz'?MO_S_UZ[i]:MO_S_RU[i]};
const rpRange=d=>({7:L('7 дней','7 kun'),30:L('30 дней','30 kun'),90:L('3 месяца','3 oy'),365:L('Год','Yil')})[d];
function ruPl(n,a){const m=n%100,k=n%10;return m>=11&&m<=14?a[2]:k===1?a[0]:k>=2&&k<=4?a[1]:a[2]}
const ordTxt=n=>LANG==='uz'?n+' ta buyurtma':n+' '+ruPl(n,['заказ','заказа','заказов']);
/* подписи на оси: 1,2 млн / 500 тыс */
function cCompact(v){
  v=Math.round(v);
  const f=x=>String(Math.round(x*10)/10).replace('.',',');
  return v>=1e9?f(v/1e9)+' '+L('млрд','mlrd'):v>=1e6?f(v/1e6)+' '+L('млн','mln'):v>=1e3?f(v/1e3)+' '+L('тыс','ming'):String(v);
}
/* верх шкалы: круглое число, чтобы половина тоже была круглой */
function niceMax(v){
  if(!(v>0))return 1;
  const pow=Math.pow(10,Math.floor(Math.log10(v))),m=v/pow;
  return [1,2,4,6,8,10].find(x=>m<=x+1e-9)*pow;
}
/* столбцы: до месяца — дни, три месяца — недели, год — месяцы */
function repBuckets(r){
  const ser=r.series,sum=(g,k)=>g.reduce((a,x)=>a+x[k],0);
  if(r.days<=30)return ser.map(x=>({n:x.n,sum:x.sum,full:dShort(x.d),ax:dShort(x.d)}));
  const out=[];
  if(r.days<=90){
    for(let i=0;i<ser.length;i+=7){const g=ser.slice(i,i+7);out.push({n:sum(g,'n'),sum:sum(g,'sum'),full:dShort(g[0].d)+(g.length>1?' – '+dShort(g[g.length-1].d):''),ax:dShort(g[0].d)})}
    return out;
  }
  const mp=new Map();
  ser.forEach(x=>{const k=x.d.slice(0,7),g=mp.get(k)||{m:k,n:0,sum:0};g.n+=x.n;g.sum+=x.sum;mp.set(k,g)});
  mp.forEach(g=>out.push({n:g.n,sum:g.sum,full:mFull(g.m),ax:mShort(g.m)}));
  return out;
}
const readTxt=b=>'<b>'+esc(b.full)+'</b> · '+esc(money(b.sum))+' · '+esc(ordTxt(b.n));

  if(i>=0&&bs[i])return readTxt(bs[i]);
  const mx=Math.max(0,...bs.map(b=>b.sum));

  return esc(L('Пик: ','Eng yuqori: '))+readTxt(bs[bs.findIndex(b=>b.sum===mx)]);
}

function repIdx(e){

  return Math.max(0,Math.min(n-1,Math.floor((e.clientX-rc.left)/rc.width*n)));
}

/* Сжимает фото на телефоне: JPEG, длинная сторона ~800 px, до ~280 КБ. */
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
    const w=img.naturalWidth,h=img.naturalHeight;
    if(!w||!h)return null;
    let k=Math.min(1,800/Math.max(w,h));
    for(let attempt=0;attempt<4;attempt++){
      const cw=Math.max(64,Math.round(w*k)),ch=Math.max(64,Math.round(h*k));
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const g=cv.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,cw,ch);g.drawImage(img,0,0,cw,ch);
      for(const q of [0.82,0.7,0.58]){
        const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
        if(blob&&blob.size<=280000)return blob;
      }
      k*=0.8;
    }
    return null;
  }finally{URL.revokeObjectURL(url)}
}
async function apiBin(method,path,blob,ctype){
  const ep=S.epoch;
  if(!S.did)return {ok:false,status:0,data:null,stale:true};
  try{
    const h={'content-type':ctype||'image/jpeg','x-shop':S.did};
    if(S.initData)h['x-init-data']=S.initData;
    const r=await fetch(path,{method,headers:h,body:blob,cache:'no-store'});
    let data=null;try{data=await r.json()}catch(e){}
    if(S.epoch!==ep)return {ok:false,status:0,data:null,stale:true};
    return {ok:r.ok,status:r.status,data};
  }catch(e){return {ok:false,status:0,data:null}}
}
function setPhotoVers(p,d){p.pv=d&&d.pv||'';p.pv2=d&&d.pv2||'';p.pv3=d&&d.pv3||''}
async function uploadPhoto(id,file,n){
  if(!S.auth||!S.admin||S.upl[id])return;
  const p=S.prod.items.find(x=>x.id===id);if(!p)return;
  n=Math.max(1,Math.min(PH_MAX,Number(n)||1));
  n=Math.min(n,phVers(p).length+1);          // фото идут подряд: следующее — сразу за последним
  S.upl[id]=n;paintPhoto(id);
  let ok=false;
  try{
    await flushSave();   // товар должен уже быть на сервере, иначе фото некуда привязать
    const blob=await shrinkPhoto(file);
    if(blob){
      const r=await apiBin('PUT','/api/admin/photo/'+encodeURIComponent(id)+'?n='+n,blob);
      if(r.ok&&r.data){setPhotoVers(p,r.data);ok=true}
    }
  }catch(e){}
  delete S.upl[id];paintPhoto(id);
  toast(ok?L('Фото сохранено','Rasm saqlandi'):L('Не удалось загрузить фото. Попробуйте другое изображение.','Rasmni yuklab boʻlmadi. Boshqa rasm tanlang.'));
}
async function removePhoto(id,n){
  const p=S.prod.items.find(x=>x.id===id);if(!p||S.upl[id])return;
  n=Math.max(1,Math.min(PH_MAX,Number(n)||1));
  S.upl[id]=n;paintPhoto(id);
  const r=await api('DELETE','/api/admin/photo/'+encodeURIComponent(id)+'?n='+n);
  if(r.ok&&r.data)setPhotoVers(p,r.data);
  delete S.upl[id];paintPhoto(id);
  if(!r.ok)toast(L('Не удалось убрать фото','Rasmni olib tashlab boʻlmadi'));
}

function queueSave(kind){
  if(kind==='prod')S.dirtyP=true;else S.dirtyC=true;
  S.dirty=true;
  if(!S.auth||!S.admin){S.saveState='nodb';paintSave();return}
  S.saveState='saving';paintSave();
  clearTimeout(saveT);saveT=setTimeout(doSave,700);
}
async function doSave(){
  if(S.saving){S.again=true;return}
  S.saving=true;
  const ep=S.epoch;
  do{
    S.again=false;
    const jobs=[];
    if(S.dirtyC){S.dirtyC=false;jobs.push(api('PUT','/api/admin/config',{cfg:clone(S.cfg)}).then(r=>{if(!r.ok&&S.epoch===ep)S.dirtyC=true;return r.ok}))}
    if(S.dirtyP){S.dirtyP=false;jobs.push(api('PUT','/api/admin/products',{prod:clone(S.prod)}).then(r=>{if(!r.ok&&S.epoch===ep)S.dirtyP=true;if(r.ok&&r.data&&r.data.prod&&S.epoch===ep)mergeMod(r.data.prod);return r.ok}))}
    const res=await Promise.all(jobs);
    S.saveState=res.every(Boolean)?'saved':'error';
  }while(S.again&&S.saveState!=='error');
  S.saving=false;
  S.dirty=S.dirtyC||S.dirtyP;
  paintSave();
}
/* Дожидается, пока все правки уйдут на сервер (нужно перед загрузкой фото). */
async function flushSave(){
  clearTimeout(saveT);
  while(S.saving)await waitMs(80);
  if(S.dirtyC||S.dirtyP)await doSave();
}

/* «Повторить заказ»: открывает дистрибьютора этого заказа и кладёт в корзину всё, что сейчас есть в продаже (по сегодняшним ценам и остаткам). */
async function repeatOrder(id,d){
  const od=d||S.did;
  const o=S.myOrders.find(x=>x.id===id&&(x.did||S.did)===od);
  if(!o)return;
  if(od!==S.did&&!(await openShop(od)))return;
  doRepeat(o);
}
function doRepeat(o){
  if(S.otherCart){askOtherCart(()=>doRepeat(o));return}
  let added=0,cut=0;const skipped=[];
  (o.items||[]).forEach(it=>{
    const p=S.prod.items.find(x=>x.id===it.id),qty=Number(it.qty)||0;
    if(!p||soldOut(p)||qty<1){skipped.push(nm(it));return}
    const cur=S.cart[p.id]||0;
    if(!cur&&cartLines().length>=MAX_LINES){skipped.push(nm(it));return}
    const want=Math.min(MAX_QTY,cur+qty),cap=maxQty(p),got=Math.min(want,cap);
    if(got<want)cut++;
    if(got>cur){S.cart[p.id]=got;added++}
  });
  saveCart();
  if(!added){toast(L('Этих товаров сейчас нет в наличии','Bu mahsulotlar hozir mavjud emas'));go('shop');return}
  S.shopPlaced=null;S.shopStep='cart';
  go('shop');
  toast(L('Товары из заказа '+o.id+' добавлены в корзину. Проверьте количество и цены.','Buyurtma '+o.id+' mahsulotlari savatga qoʻshildi. Miqdor va narxlarni tekshiring.')
    +(skipped.length?L(' Нет в наличии: ',' Mavjud emas: ')+skipped.slice(0,3).join(', ')+(skipped.length>3?'…':'')+'.':'')
    +(cut?L(' Количество уменьшено по остатку.',' Miqdor qoldiqqa qarab kamaytirildi.'):''));
}
async function cancelMine(id,d){
  const od=d||S.did;

    toast(L('Не удалось отменить: продавец уже принял заказ. Напишите ему.','Bekor qilib boʻlmadi: sotuvchi buyurtmani qabul qilgan. Unga yozing.'));

}

/* Где сейчас телефон: ok({lat,lng},точность в метрах) или fail('denied'|'na'|'fail'|'timeout') */
function getPos(ok,fail){
  if(!navigator.geolocation){fail('na');return}
  let done=false;
  const fin=(f,a,b)=>{if(done)return;done=true;clearTimeout(to);f(a,b)};
  const to=setTimeout(()=>fin(fail,'timeout'),20000);
  try{
    navigator.geolocation.getCurrentPosition(p=>{const l=cleanLoc({lat:p.coords.latitude,lng:p.coords.longitude});if(l)fin(ok,l,p.coords.accuracy);else fin(fail,'fail')},e=>fin(fail,e&&e.code===1?'denied':'fail'),{enableHighAccuracy:true,timeout:15000,maximumAge:20000});
  }catch(e){fin(fail,'fail')}
}

async function hubBin(method,path,blob){

const RV_WHY=()=>[['nophoto',L('Нет фото','Rasm yoʻq'),L('Нет фото.','Rasm yoʻq.')],['nouz',L('Нет названия по-узбекски','Oʻzbekcha nomi yoʻq'),L('Нет названия по-узбекски.','Oʻzbekcha nomi yoʻq.')],['price',L('Неверная цена','Narx notoʻgʻri'),L('Неверная цена.','Narx notoʻgʻri.')],['name',L('Ошибка в названии','Nomida xato'),L('Ошибка в названии.','Nomida xato bor.')],['other',L('Другое','Boshqa'),'']];
function rvWhen(iso){
  const t=new Date(iso);
  if(!iso||isNaN(t.getTime()))return '';
  const hm=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  const a=agoTxt(iso);
  return a===L('сегодня','bugun')?a+', '+hm:a;
}
function rvList(){
  const v=S.rv;
  if(v.did&&!v.shops.some(x=>x.id===v.did))v.did='';
  const cats=new Set(v.items.filter(p=>!v.did||p.did===v.did).map(catLabel));
  if(v.cat&&!cats.has(v.cat))v.cat='';
  const q=normQ(v.q.trim()).split(/\s+/).filter(Boolean);
  return v.items.filter(p=>{
    if(v.did&&p.did!==v.did)return false;
    if(v.cat&&catLabel(p)!==v.cat)return false;
    if(!q.length)return true;
    const hay=normQ([p.name,p.uz,p.dname,catLabel(p),weightLabel(p)].join(' '));
    return q.every(w=>hay.indexOf(w)>=0);
  });
}

  v.items=Array.isArray(r.data.items)?r.data.items:[];v.counts=Object.assign({wait:0,ret:0,ok:0},r.data.counts);v.shops=Array.isArray(r.data.shops)?r.data.shops:[];

function rvRetSync(){

  if(c)c.textContent=v.rtxt.length+' / 300';

function rvWhy(k,ph){
  const v=S.rv,ta=$('#rtxt');if(!v.ret||!ta)return;
  if(ph&&v.rtxt.indexOf(ph)<0){
    const cur=v.rtxt.trim();
    v.rtxt=((cur?cur+' ':'')+ph).slice(0,300);
    ta.value=v.rtxt;
  }
  rvRetSync();
  try{ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}catch(e){}
}
async function rvSend(){
  const v=S.rv,r0=v.ret,reason=v.rtxt.trim();
  if(!r0||v.busy||!reason)return;
  v.busy=true;rvRetSync();
  const r=await api('POST','/api/hub/admin/mod/return',{did:r0.did,id:r0.id,reason});

  if(!r.ok){
    if(r.status===409){v.ret=null;v.rtxt='';paintRvSheet();toast(L('Этот товар уже обработан','Bu mahsulot allaqachon koʻrib chiqilgan'));loadReview(true);return}
    rvRetSync();toast(L('Не удалось вернуть. Проверьте соединение.','Qaytarib boʻlmadi. Ulanishni tekshiring.'));return;
  }
  v.ret=null;v.rtxt='';paintRvSheet();

}

    if(i<=cnt)h+='<div class="pslot has'+(e.upl===i?' load':'')+'"><label for="rph-'+i+'" aria-label="'+esc(L('Заменить фото '+i,i+'-rasmni almashtirish'))+'"><img src="'+imgUrl(p,i,e.did)+'" alt="" decoding="async"></label>'+(i===1?'<span class="pmain">'+L('Главное','Asosiy')+'</span>':'')+(busy?'':'<button type="button" class="px" data-act="rphdel" data-n="'+i+'" aria-label="'+esc(L('Убрать фото '+i,i+'-rasmni olib tashlash'))+'">×</button>')+inp+'</div>';

async function rvPhotoUp(file,n){

      const r=await hubBin('PUT','/api/hub/admin/mod/photo?did='+encodeURIComponent(e.did)+'&id='+encodeURIComponent(e.p.id)+'&n='+n,blob);

async function rvPhotoDel(n){

function rvSyncTiers(){
  const e=S.rv.edit;if(!e)return;
  const rows=[];
  for(let i=0;i<3;i++){
    const a=$('#rtn-'+i),b=$('#rtp-'+i);
    const n=a?String(a.value).trim():'',pr=b?String(b.value).trim():'';
    if(n!==''&&pr!=='')rows.push({n:Number(n),price:Number(pr)});
  }
  e.p.tiers=cleanTiers(rows,e.p.price);
  const w=$('#rtw');
  if(w)w.textContent=e.p.tiers.length<rows.length?L('Одна из строк не учтена: цена ступени должна быть ниже обычной и ниже предыдущей, а количество — больше предыдущего (от 2 до 500).','Qatorlardan biri hisobga olinmadi: pogʻona narxi odatdagidan va oldingisidan past, miqdor esa oldingisidan katta boʻlishi kerak (2 dan 500 gacha).'):'';
}
function rvField(t){
  const e=S.rv.edit;if(!e)return;
  const p=e.p,k=t.dataset.rf;
  if(k==='amount'||k==='price'||k==='old'){const v=Number(t.value);p[k]=isFinite(v)&&v>=0?v:0;if(k==='price')rvSyncTiers()}
  else if(k==='blk'||k==='box'){const v=Math.round(Number(t.value));p[k]=v>=2&&v<=500?v:0}
  else if(k==='tn'||k==='tp')rvSyncTiers();
  else p[k]=t.value;
  const er=$('#rerr');if(er)er.textContent='';
}
async function rvSave(){
  const e=S.rv.edit;if(!e||e.busy||e.upl)return;
  const p=e.p,er=$('#rerr'),btn=$('#rsave');

  if(!(Number(p.price)>0)){if(er)er.textContent=L('Укажите цену','Narxni kiriting');return}
  e.busy=true;if(btn)btn.disabled=true;
  const item={name:p.name,uz:p.uz,desc:p.desc,descUz:p.descUz,cat:p.cat,amount:p.amount,unit:p.unit,price:p.price,tiers:p.tiers||[],blk:p.blk,box:p.box,tag:p.tag,old:p.old};
  const r=await api('PUT','/api/hub/admin/mod/edit',{did:e.did,id:p.id,item});
  e.busy=false;
  if(!r.ok||!r.data||!r.data.item){if(btn)btn.disabled=false;if(er)er.textContent=L('Не удалось сохранить. Проверьте соединение.','Saqlab boʻlmadi. Ulanishni tekshiring.');return}
  const i=S.rv.items.findIndex(x=>x.did===e.did&&x.id===p.id);
  if(i>=0){
    const old=S.rv.items[i],cat=e.cats.find(c=>c.id===r.data.item.cat)||{};
    S.rv.items[i]=Object.assign({},old,r.data.item,{did:old.did,dname:old.dname,catName:cat.name||'',catUz:cat.uz||''});
  }
  S.rv.edit=null;paintReview();
  toast(L('Сохранено','Saqlandi'));
}

function go(v){
  // каталог, профиль и панель продавца есть только внутри дистрибьютора
  if(!S.did&&(v==='shop'||v==='profile'||v==='seller'||v==='courier'))v='shops';
  if(v==='courier'&&!S.courier)v='shop';
  if(v==='owner'&&!isOwner())v='shops';
  if(v==='base'&&!canBase())v='shops';
  if(v==='review'&&!isOwner())v='shops';
  if(v==='analytics'&&!isOwner())v='shops';
  const was=S.view;
  if(v==='base'&&was!=='base')baseResetUI();
  S.view=v;S.cc=null;S.msub=null;setScrollLock();
  render();window.scrollTo(0,0);
  if(v==='mine')loadMine();
  if(v==='debt')loadMyDebt(true);
  if(v==='shop')loadCfg();
  if(v==='seller')loadAdmin();
  if(v==='courier')loadCourier();
  if(v==='shops')loadHub();
  if(v==='owner')loadOwner();
  if(v==='base')loadBase(true);
  if(v==='analytics')loadAnalytics();
  if(v==='review'){S.rv.ret=null;S.rv.edit=null;loadReview()}
}

const regionsInUse=()=>regionsOn()&&S.hub.shops.some(r=>hasZone(r.regions)||r.home);
function shopCardHTML(r){
  const meta=[],reg=S.region&&regionsInUse()?S.region:'';
  if(r.items)meta.push(L(r.items+' '+plTovar(r.items),r.items+' ta mahsulot'));
  if(!r.delivery)meta.push(L('только самовывоз','faqat olib ketish'));
  else if(hasZone(r.regions)){
    const n=cleanRegions(r.regions).length;
    meta.push(reg?(deliversTo(r,reg)?L('доставка к вам','sizga yetkazib beradi'):L('к вам не доставляет, самовывоз','sizga yetkazmaydi, olib ketish')):L('доставка в '+n+' рег.','yetkazib berish: '+n+' ta hudud'));

  else meta.push(L('есть доставка','yetkazib berish bor'));

function shopsListHTML(){
  const all=S.hub.shops;
  if(!all.length)return '<div class="empty"><b>'+L('Пока нет дистрибьюторов с товарами','Hozircha mahsulotli distribyutorlar yoʻq')+'</b>'+L('Загляните позже.','Keyinroq qaytib keling.')+'</div>';

  const near=all.filter(r=>servesRegion(r,S.region)),far=all.filter(r=>!servesRegion(r,S.region));

async function loadHub(){

  if(!r.ok||!r.data){
    if(!S.hub.loaded){S.hub.err=true;if(S.view==='shops')renderShops()}
    return false;
  }
  const d=r.data,h=S.hub;
  const next={title:d.title||'',shops:Array.isArray(d.shops)?d.shops:[],me:d.me||null,terrs:Array.isArray(d.terrs)?d.terrs:[]};
  if(d.me){
    S.auth=true;S.uid=d.me.id;
    // регион: что выбрано на этом телефоне, то главнее; если здесь пусто, берём с площадки
    const sr=regionsOn()?cleanRegion(d.me.region):'';
    if(sr&&!S.region){S.region=sr;saveRegionLocal()}
    else if(S.region&&sr!==S.region&&!S.regSent){S.regSent=true;api('PUT','/api/hub/region',{region:S.region})}
  }
  const same=h.loaded&&JSON.stringify([h.title,h.shops,h.me,h.terrs])===JSON.stringify([next.title,next.shops,next.me,next.terrs]);
  Object.assign(h,next,{loaded:true,err:false});
  if(same)return true;
  renderNav();
  if(S.view==='shops')renderShops();
  return true;
}
/* Открывает каталог дистрибьютора: всё, что относилось к прежнему, сбрасывается. Возвращает true, если получилось. */
async function openShop(did){
  if(!validDid(did)||S.switching)return false;
  if(S.did===did)return true;
  S.switching=true;
  try{
    if(S.did&&(S.dirty||S.saving))await flushSave();
    view.innerHTML='<div class="wrap page"><div class="empty"><b>'+L('Загружаем каталог','Katalog yuklanmoqda')+'</b>'+L('Подождите секунду.','Bir soniya kuting.')+'</div></div>';
    let r=S.initData?await api('GET','/api/bootstrap',undefined,did):null;
    if(!r||r.status===401)r=await api('GET','/api/config',undefined,did);
    if(!r.ok||!r.data){
      toast(L('Не удалось открыть каталог. Проверьте соединение.','Katalogni ochib boʻlmadi. Ulanishni tekshiring.'));
      render();
      return false;
    }
    const d=r.data;
    S.epoch++;
    resetShopState();
    S.did=did;
    S.cfg=mergeCfg(d.cfg);S.prod=normProd(d.prod);S.off=!!d.off;
    if(d.me){
      S.admin=!!d.me.admin;S.courier=d.me.courier||null;S.profile=d.me.profile||null;S.blocked=!!d.me.blocked;
      S.fav=Array.isArray(d.me.fav)?d.me.fav:[];
    }
    loadCart();pruneCart();normalizeMode();applyProfile();
    return true;
  }finally{S.switching=false}
}
async function enterShop(did,v,cart){
  if(!(await openShop(did))){if(!S.did)S.view='shops';render();return false}
  S.shopPlaced=null;S.shopStep=cart&&cartCount()>0?'cart':'list';
  go(v==='seller'&&S.admin?'seller':v==='courier'&&S.courier?'courier':'shop');
  return true;
}

async function loadBase(reset){
  const b=S.base,seq=++b.seq;
  const r=await api('GET','/api/hub/base?terr='+encodeURIComponent(b.terr)+'&f='+encodeURIComponent(b.f)+'&ag='+encodeURIComponent(b.ag)+'&sort='+encodeURIComponent(b.sort)+(b.sort==='near'&&b.near?'&lat='+b.near.lat+'&lng='+b.near.lng:'')+'&q='+encodeURIComponent(b.q)+(isOwner()||!isAgent()?'&sh='+encodeURIComponent(baseShop())+(b.mc?'&mine=1':''):'')+'&off='+(reset?0:b.items.length));

  if(!r.ok||!r.data||!Array.isArray(r.data.items)){

    if(S.view==='base')renderBase();

  }
  const d=r.data,first=!b.loaded;
  Object.assign(b,{role:d.role,total:d.total,all:d.all,counts:d.counts||{},unchk:d.unchk||0,terrs:d.terrs||[],mine:d.mine||[],agents:d.agents||[],more:!!d.more,loaded:true,err:false});

async function baseSave(){

  const f=b.fm,body={name:f.name.trim(),phone:f.phone.trim(),addr:f.addr.trim(),terr:f.terr,st:f.st,note:f.note.trim()};

async function ownPct(id){
  const o=S.own;if(o.busy)return;
  const row=o.stats&&o.stats.rows.find(x=>x.id===id);
  const raw=String(o.pcts[id]!==undefined?o.pcts[id]:(row?row.pct:'')).trim().replace(',','.');
  const v=Number(raw);
  if(raw===''||!isFinite(v)||v<0||v>50){toast(ownErr('bad_pct'));return}
  o.busy='pct';renderOwner();
  const r=await api('PUT','/api/hub/admin/shops/'+encodeURIComponent(id),{pct:v});
  o.busy='';
  if(r.ok&&r.data&&typeof r.data.pct==='number'){
    delete o.pcts[id];
    toast(L('Процент сохранён: '+fmtPct(r.data.pct)+'%. Он действует на заказы, которые выдаются с этого момента.','Foiz saqlandi: '+fmtPct(r.data.pct)+'%. U shu paytdan topshiriladigan buyurtmalarga amal qiladi.'));
  }else toast(ownErr(r.data&&r.data.error));
  renderOwner();
  loadOwnerStats();
}

async function ownAdd(){
  const o=S.own;if(o.busy)return;
  const name=o.fname.trim(),code=o.fcode.trim();
  if(name.length<2){o.err2=ownErr('bad_name');renderOwner();return}
  if(code&&code.length<12){o.err2=ownErr('weak_code');renderOwner();return}
  o.busy='add';o.err2='';renderOwner();
  const r=await api('POST','/api/hub/admin/shops',code?{name,code}:{name});
  o.busy='';
  if(!r.ok||!r.data){o.err2=ownErr(r.data&&r.data.error);renderOwner();return}
  o.shops=o.shops.concat([r.data.shop]);
  o.made={name:r.data.shop.name,code:r.data.code,reset:false};
  o.fname='';o.fcode='';
  renderOwner();window.scrollTo(0,0);
  loadHub();
}
async function ownToggle(id){
  const o=S.own,rec=o.shops.find(x=>x.id===id);if(!rec||o.busy)return;
  o.busy='tg';renderOwner();
  const r=await api('PUT','/api/hub/admin/shops/'+encodeURIComponent(id),{on:!rec.on});
  o.busy='';
  if(r.ok&&r.data&&r.data.shop)o.shops=o.shops.map(x=>x.id===id?r.data.shop:x);
  else toast(ownErr(r.data&&r.data.error));
  renderOwner();
  loadHub();
}

  const r=await api('GET','/api/hub/admin/people');
  if(r.ok&&r.data&&Array.isArray(r.data.terr)){S.own.ppl=r.data;ownRefresh()}
}
/* одно действие владельца: показывает занятость, обновляет список, возвращает ответ сервера или null */
async function peopleCall(method,path,body){
  const o=S.own;if(o.pbusy)return null;
  o.pbusy=true;o.perr='';renderOwner();
  const r=await api(method,'/api/hub/admin'+path,body);
  o.pbusy=false;
  if(!r.ok||!r.data){o.perr=peopleErr(r.data&&r.data.error);renderOwner();return null}
  o.ppl=r.data.state||r.data;
  renderOwner();
  return r.data;
}

async function ownTerrAdd(names){
  const d=await peopleCall('POST','/terr',{names});
  if(d){S.own.tname='';renderOwner()}
}
async function ownAgentAdd(){
  const o=S.own,name=o.aname.trim(),code=o.acode.trim();
  if(name.length<2){o.perr=peopleErr('bad_name');renderOwner();return}
  if(code&&code.length<12){o.perr=peopleErr('weak_code');renderOwner();return}
  const d=await peopleCall('POST','/agents',code?{name,terr:o.aterr,code}:{name,terr:o.aterr});
  if(d){o.amade={name,code:d.code,reset:false};o.aname='';o.acode='';o.aterr=[];renderOwner();window.scrollTo(0,0);loadHub()}
}
/* удаление дистрибьютора совсем: товары, заказы, клиенты и продавцы; сервер сам не даёт удалить первого */
async function ownDelete(id){
  const o=S.own,rec=o.shops.find(x=>x.id===id);if(!rec||o.busy)return;
  o.busy='del';o.rc='';renderOwner();
  const r=await api('DELETE','/api/hub/admin/shops/'+encodeURIComponent(id));
  o.busy='';
  if(!r.ok){toast(ownErr(r.data&&r.data.error));if(r.data&&r.data.error==='not_found')o.shops=o.shops.filter(x=>x.id!==id);renderOwner();return}
  o.shops=o.shops.filter(x=>x.id!==id);
  toast(L('Дистрибьютор «'+rec.name+'» удалён','Distribyutor «'+rec.name+'» oʻchirildi'));
  renderOwner();
  loadHub();loadOwnerStats();
}
async function ownReset(id){
  const o=S.own,rec=o.shops.find(x=>x.id===id);if(!rec||o.busy)return;
  o.busy='rc';o.rc='';renderOwner();
  const r=await api('POST','/api/hub/admin/shops/'+encodeURIComponent(id)+'/code',{});
  o.busy='';
  if(!r.ok||!r.data){toast(ownErr(r.data&&r.data.error));renderOwner();return}
  o.shops=o.shops.map(x=>x.id===id?r.data.shop:x);
  o.made={name:rec.name,code:r.data.code,reset:true};
  renderOwner();window.scrollTo(0,0);
}
async function ownTitle(){
  const o=S.own;if(o.busy)return;
  const t=(o.ftitle===null?o.title:o.ftitle).trim();
  o.busy='tt';renderOwner();
  const r=await api('PUT','/api/hub/admin/title',{title:t});
  o.busy='';
  if(r.ok&&r.data){o.title=r.data.title;o.ftitle=null;S.hub.title=r.data.title;renderNav();toast(L('Название сохранено','Nom saqlandi'))}
  else toast(ownErr(r.data&&r.data.error));
  renderOwner();
}
/* поле количества потеряло фокус: пустое или 0 убирает товар, слишком большое число обрезается */
function qtyDone(t){
  const id=t.dataset.qty,cur=S.cart[id]||0;
  let v=Math.floor(Number(t.value));
  if(!isFinite(v)||v<1)v=0;
  v=cartSet(id,v);   // обрезает до остатка и сохраняет
  if(!v){
    if(!cartCount()){S.shopStep='list';renderShop();renderNav();return}
    if(S.shopStep==='cart'){paintCartLines();paintShopBar();renderNav()}else paintShopCtl(id);
    return;
  }
  t.value=String(v);
  if(cur!==v)refreshTotals(id);
}

  }
  else if(t.dataset.s){
    const k=t.dataset.s;

    if(k==='name'){$('#brandName').textContent=t.value||DEFAULT.shop.name;document.title=t.value||DEFAULT.shop.name}
    queueSave();
  }
});

    const raw=String(t.value).trim(),v=Number(raw);
    if(raw===''||!Number.isInteger(v)||v<0||v>1000000){toast(L('Порог — целое число, 0 или больше','Chegara — butun son (0 yoki koʻp)'));t.value=String(s.low);return}
    if(v!==s.low)stockDo(id,{op:'low',n:v},L('Порог сохранён','Chegara saqlandi'),true);
  }
});
/* картинка не загрузилась: оставляем заглушку */
document.addEventListener('error',e=>{
  const t=e.target;
  if(t&&t.tagName==='IMG'&&t.closest('.pimg,.cth,.pthumb,.th,.pslot,.lb-slide')){
    const ph=document.createElement('span');ph.className='ph';ph.textContent='📦';ph.setAttribute('aria-hidden','true');
    t.replaceWith(ph);
  }
},true);

/* ---------- network ---------- */
/* Запросы к дистрибьютору идут с его номером в заголовке x-shop (по умолчанию открытый сейчас). Ответ, пришедший уже после перехода к другому дистрибьютору, отбрасывается. */
const isHubPath=path=>path==='/api/shops'||path.indexOf('/api/hub/')===0;
async function api(method,path,body,did){
  const ep=S.epoch,hub=isHubPath(path),d=did||S.did;
  if(!hub&&!d)return {ok:false,status:0,data:null,stale:true};
  try{
    const h={'content-type':'application/json'};
    if(S.initData)h['x-init-data']=S.initData;
    if(!hub)h['x-shop']=d;
    const r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
    let data=null;try{data=await r.json()}catch(e){}
    if(!hub&&!did&&S.epoch!==ep)return {ok:false,status:0,data:null,stale:true};
    return {ok:r.ok,status:r.status,data};
  }catch(e){return {ok:false,status:0,data:null}}
}
/* «Мои заказы» — заказы клиента у всех дистрибьюторов сразу (каждый с полями did и shopName) */
async function loadMine(){
  if(!S.auth)return;
  const r=await api('GET','/api/hub/orders');
  if(!r.ok||!r.data||!Array.isArray(r.data.orders))return;
  if(JSON.stringify(r.data.orders)===JSON.stringify(S.myOrders))return;
  S.myOrders=r.data.orders;renderNav();
  if(S.view==='mine')renderMine();
}
async function loadAdmin(){
  if(!S.admin||!S.did)return;
  loadStock();loadDebts();
  if((S.sellerTab==='dlv'&&S.view==='seller')||!S.dv.ok||S.dv.list.length)loadCouriers();
  const r=await api('GET','/api/admin/orders');
  if(!r.ok||!r.data)return;
  if(JSON.stringify(r.data.orders)===JSON.stringify(S.allOrders)&&JSON.stringify(r.data.stats)===JSON.stringify(S.stats))return;
  S.allOrders=r.data.orders;S.stats=r.data.stats;renderNav();
  const ae=document.activeElement;
  if(S.view==='seller'&&S.sellerTab==='orders'&&!(S.pay&&ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)))paintSeller();
}
async function loadCfg(){
  if(!S.did||S.dirty||S.saving||!S.ready)return;
  const r=await api('GET','/api/config');
  if(!r.ok||!r.data)return;
  const next=mergeCfg(r.data.cfg),nextP=normProd(r.data.prod),off=!!r.data.off;
  if(JSON.stringify(next)===JSON.stringify(S.cfg)&&JSON.stringify(nextP)===JSON.stringify(S.prod)&&off===S.off)return;
  const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(S.view==='shop'&&typing)return;
  if(S.view==='seller'&&S.sellerTab==='prod'&&typing)return;
  const msig=x=>x.items.map(p=>p.id+':'+(p.ms||'')+':'+(p.mc||'')).join();
  const msChanged=msig(nextP)!==msig(S.prod);
  S.cfg=next;S.prod=nextP;S.off=off;normalizeMode();
  if(S.view==='seller'&&msChanged){paintTabs();if(S.sellerTab==='prod')paintSeller()}
  const pruned=pruneCart();
  renderNav();
  if(S.view==='shop'&&!S.shopPlaced){
    if(S.shopStep==='cart'&&!cartCount())S.shopStep='list';
    renderShop();
    if(pruned)toast(L('Остатки изменились, мы обновили корзину','Qoldiq oʻzgardi, savatni yangiladik'));
  }
}
function applyTheme(){
  try{
    const cs=S.tg&&S.tg.colorScheme;
    if(cs==='dark'||cs==='light')document.documentElement.setAttribute('data-theme',cs);
    const dark=cs?cs==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
    const bg=dark?'#0E1614':'#F3F7F6';
    if(S.tg&&S.tg.setHeaderColor){S.tg.setHeaderColor(bg);S.tg.setBackgroundColor(bg)}
  }catch(e){}
}
let tickN=0;
function tick(){
  if(document.visibilityState==='hidden'||!S.ready)return;
  tickN++;
  if(S.auth&&S.view==='mine')loadMine();
  if(S.auth&&(S.view==='debt'||tickN%4===0))loadMyDebt(S.view==='debt');
  if((S.view==='shops'||S.view==='review')&&tickN%2===0)loadHub();
  else if(isOwner()&&tickN%4===0)loadHub();
  if(isOwner()&&(tickN%4===0||(S.view==='owner'&&S.own.sec==='disp'&&tickN%2===0)))loadDisputes();
  if(S.view==='review'&&tickN%2===0&&!S.rv.ret&&!S.rv.edit&&!S.rv.busy)loadReview(true);
  if(S.admin&&S.did&&(S.view==='seller'||tickN%2===0))loadAdmin();
  if(S.courier&&S.did&&(S.view==='courier'||tickN%2===0))loadCourier();
  if(S.did&&tickN%4===0)loadCfg();
}
(async function init(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){
    S.tg=tg;
    if(tg.initData)S.initData=tg.initData;
    try{tg.ready();tg.expand();if(tg.onEvent)tg.onEvent('themeChanged',applyTheme)}catch(e){}
  }
  initLang();applyTheme();
  renderNav();
  view.innerHTML='<div class="wrap page"><div class="empty"><b>'+L('Загружаем каталог','Katalog yuklanmoqda')+'</b>'+L('Подождите секунду.','Bir soniya kuting.')+'</div></div>';
  /* адрес: ?d=<дистрибьютор> открывает его каталог, ?v=mine|seller|owner — нужный раздел */
  const want=QS.get('d')||'',vw=QS.get('v')||'';
  loadRegion();
  await loadHub();
  if(S.initData&&!S.auth)S.authErr='auth';
  loadForm();loadCart();
  const me=S.hub.me;
  let did=validDid(want)?want:'';
  if(!did&&!vw&&S.hub.shops.length===1)did=S.hub.shops[0].id;   // дистрибьютор один: список выбирать не из чего
  if(!did&&!S.hub.loaded&&vw!=='owner'&&vw!=='review'&&vw!=='analytics')did='main';   // список недоступен (площадка не подключена): работаем как раньше, с первым дистрибьютором
  if(!did&&vw==='seller'&&me&&me.sells.length===1)did=me.sells[0].id;
  if(!did&&vw==='courier'&&me&&me.delivers&&me.delivers.length===1)did=me.delivers[0].id;
  S.ready=true;
  let v='shops';
  if(did&&await openShop(did))v=vw==='review'&&isOwner()?'review':vw==='seller'&&S.admin?'seller':vw==='courier'&&S.courier?'courier':vw==='mine'?'mine':vw==='debt'?'debt':'shop';
  else if(vw==='mine')v='mine';
  else if(vw==='debt')v='debt';
  else if(vw==='owner'&&isOwner())v='owner';
  else if(vw==='base'&&canBase())v='base';
  else if(vw==='review'&&isOwner())v='review';
  else if(vw==='analytics'&&isOwner())v='analytics';
  S.view=v;
  render();
  if(v==='debt')loadMyDebt(true);
  if(v==='owner')loadOwner();
  if(v==='base')loadBase(true);
  if(v==='analytics')loadAnalytics();
  if(v==='review')loadReview();
  if(S.admin&&S.did)loadAdmin();
  if(S.courier&&S.did)loadCourier();
  if(isOwner()&&v!=='owner')loadDisputes();
  loadMine();if(v!=='debt')loadMyDebt(false);
  setInterval(tick,15000);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible')return;
    loadCfg();loadMine();loadMyDebt(S.view==='debt');loadAdmin();loadCourier();
    if(S.view==='shops')loadHub();
  });
})();
</script>
