name = "distro-orders"
main = "dist/worker.js"
compatibility_date = "2025-09-01"

# Хранилище заказов и каталога: один Durable Object на SQLite (входит в бесплатный тариф)
[[durable_objects.bindings]]
name = "SHOP"
class_name = "Shop"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Shop"]

