name = "distro-orders"
main = "dist/worker.js"
compatibility_date = "2025-09-01"

# Хранилище каждого дистрибьютора (заказы, каталог, клиенты): свой Durable Object на SQLite для каждого (входит в бесплатный тариф)
[[durable_objects.bindings]]
name = "SHOP"
class_name = "Shop"

# Площадка: реестр дистрибьюторов, их коды, список компаний для клиентов
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Shop"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

# Секреты BOT_TOKEN и ADMIN_CODE здесь НЕ пишем. Их задают командами wrangler secret put (или на сайте Cloudflare: Settings → Variables and Secrets).

# Каждое утро в 04:00 по Гринвичу (09:00 в Ташкенте): продавцам приходит список магазинов с просроченным долгом.
[triggers]
crons = ["0 4 * * *"]
